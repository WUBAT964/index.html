<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月度好菜投票系统</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; display: flex; flex-direction: column; position: relative; }
        .card:hover { transform: translateY(-5px); }
        
        /* 领奖模式特效 */
        .card.rank-1 { border: 3px solid #FFD700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
        .card.rank-2 { border: 3px solid #C0C0C0; box-shadow: 0 0 15px rgba(192, 192, 192, 0.5); }
        .card.rank-3 { border: 3px solid #CD7F32; box-shadow: 0 0 15px rgba(205, 127, 50, 0.5); }
        
        .rank-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 12px; border-radius: 15px; font-weight: bold; z-index: 10; }
        .rank-1 .rank-badge { background: #FFD700; color: #333; }
        .rank-2 .rank-badge { background: #C0C0C0; color: #333; }
        .rank-3 .rank-badge { background: #CD7F32; color: white; }

        .card img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .card-content { padding: 15px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.2em; font-weight: bold; color: #333; margin-bottom: 5px; }
        .card-chef { font-size: 0.9em; color: #007bff; margin-bottom: 5px; font-weight: bold; }
        .card-date { font-size: 0.85em; color: #888; margin-bottom: 5px; }
        .my-vote { font-size: 0.9em; color: #28a745; margin-bottom: 5px; font-weight: bold; }
        .vote-count { color: #666; margin-bottom: 15px; font-size: 1.1em; }
        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        .vote-btn { flex: 1; background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: background 0.2s; }
        .vote-btn:hover { background-color: #0056b3; }
        .vote-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .unvote-btn { flex: 1; background-color: #6c757d; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: background 0.2s; }
        .unvote-btn:hover { background-color: #5a6268; }
        .unvote-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        /* 底部模式切换按钮 */
        .mode-switch-bottom { text-align: center; margin-top: 40px; margin-bottom: 20px; }
        .mode-btn { background-color: #ff9800; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 1.1em; cursor: pointer; transition: background 0.3s; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .mode-btn:hover { background-color: #e68a00; }
        .mode-btn.prize { background-color: #2196F3; }
        .mode-btn.prize:hover { background-color: #0b7dda; }
        .mode-desc { color: #d9534f; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="page-title">🍽️ 月度好菜投票</h1>
        <p id="mode-desc" class="mode-desc" style="text-align: center;">每人最多只能投 3 票</p>
        
        <!-- 菜品展示区 -->
        <div class="grid" id="dish-grid"></div>
        
        <!-- 模式切换按钮移到了最下面 -->
        <div class="mode-switch-bottom">
            <button class="mode-btn" id="mode-btn" onclick="toggleMode()">切换到领奖模式 🏆</button>
        </div>
    </div>

    <script>
        // ⚠️⚠️⚠️ 请确认这是你最新的 Cloudflare 隧道地址 ⚠️⚠️⚠️
        const API_BASE_URL = 'https://hurricane-lightbox-funky-kitchen.trycloudflare.com'; 
        const BASE_URL = 'https://wubat964.github.io/index.html'; 
        const IMG_BASE_URL = API_BASE_URL; 

        let allVotes = {};
        let dishesData = [];
        let isPrizeMode = false;
        const MAX_VOTES = 3;
        let userVotes = JSON.parse(localStorage.getItem('userVotes')) || {};

        window.handleImgError = function(img) {
            img.onerror = null;
            img.src = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22250%22%20height%3D%22200%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23eee%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20font-family%3D%22Arial%22%20font-size%3D%2214%22%20fill%3D%22%23999%22%20text-anchor%3D%22middle%22%20dy%3D%223em%22%3E暂无图片%3C%2Ftext%3E%3C%2Fsvg%3E';
        };

        async function init() {
            try {
                const [dishesRes, votesRes] = await Promise.all([
                    fetch(`${BASE_URL}/dishes.json`), 
                    fetch(`${API_BASE_URL}/api/votes`)
                ]);
                dishesData = await dishesRes.json();
                allVotes = await votesRes.json();
                
                renderCurrentMode();
            } catch (error) {
                console.error('初始化失败:', error);
                document.getElementById('dish-grid').innerHTML = '<p style="text-align:center;color:red;">数据加载失败，请刷新重试</p>';
            }
        }

        // 切换模式
        function toggleMode() {
            isPrizeMode = !isPrizeMode;
            const btn = document.getElementById('mode-btn');
            const title = document.getElementById('page-title');
            const desc = document.getElementById('mode-desc');

            if (isPrizeMode) {
                btn.textContent = '切换回投票模式 🗳️';
                btn.classList.add('prize');
                title.textContent = '🏆 月度好菜颁奖典礼';
                desc.textContent = '恭喜以下获奖菜品及厨师！';
                desc.style.color = '#28a745';
            } else {
                btn.textContent = '切换到领奖模式 🏆';
                btn.classList.remove('prize');
                title.textContent = '🍽️ 月度好菜投票';
                desc.textContent = '每人最多只能投 3 票';
                desc.style.color = '#d9534f';
            }
            renderCurrentMode();
        }

        // 根据当前模式渲染
        function renderCurrentMode() {
            let sortedDishes = [...dishesData];
            let displayDishes = [];

            if (isPrizeMode) {
                // 领奖模式：按总票数从高到低排序
                sortedDishes.sort((a, b) => {
                    const voteA = allVotes[String(a.id)] || 0;
                    const voteB = allVotes[String(b.id)] || 0;
                    return voteB - voteA;
                });
                // 只取前3名（且票数大于0）
                displayDishes = sortedDishes.filter(d => (allVotes[String(d.id)] || 0) > 0).slice(0, 3);
            } else {
                // 投票模式：按日期先后顺序排序（早 -> 晚）
                sortedDishes.sort((a, b) => {
                    const dateA = a.date ? new Date(a.date).getTime() : 0;
                    const dateB = b.date ? new Date(b.date).getTime() : 0;
                    return dateA - dateB; 
                });
                displayDishes = sortedDishes;
            }
            
            renderDishes(displayDishes);
        }

        function getUsedVotes() {
            return Object.values(userVotes).reduce((sum, count) => sum + count, 0);
        }

        function renderDishes(dishes) {
            const grid = document.getElementById('dish-grid');
            grid.innerHTML = '';
            if (!Array.isArray(dishes)) return;

            const usedVotes = getUsedVotes();
            const isMaxed = usedVotes >= MAX_VOTES;

            dishes.forEach((dish, index) => {
                const dishId = String(dish.id);
                const voteCount = allVotes[dishId] || 0;
                const myVoteCount = userVotes[dishId] || 0;
                
                let chefName = '';
                if (dish.chef1 && dish.chef2) {
                    chefName = `${dish.chef1} & ${dish.chef2}`;
                } else if (dish.chef1) {
                    chefName = dish.chef1;
                } else if (dish.chef2) {
                    chefName = dish.chef2;
                } else {
                    chefName = '未知厨师';
                }

                let dishDate = dish.date || '未知日期';
                if (dish.date && dish.date.includes('-')) {
                    const parts = dish.date.split('-');
                    if (parts.length >= 3) {
                        dishDate = `${parts[1]}月${parts[2]}日`; 
                    }
                }

                let rawImg = (dish.img || '').trim();
                let imageUrl = '';
                if (rawImg && rawImg !== '') {
                    let finalPath = rawImg.includes('images/') ? rawImg : 'images/' + rawImg;
                    imageUrl = `${IMG_BASE_URL}/${finalPath}`;
                } else {
                    imageUrl = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22250%22%20height%3D%22200%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23eee%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20font-family%3D%22Arial%22%20font-size%3D%2214%22%20fill%3D%22%23999%22%20text-anchor%3D%22middle%22%20dy%3D%223em%22%3E暂无图片%3C%2Ftext%3E%3C%2Fsvg%3E';
                }

                // 领奖模式下的排名徽章样式（直接根据索引和票数判断）
                let rankClass = '';
                let rankBadge = '';
                if (isPrizeMode && voteCount > 0) {
                    if (index === 0) {
                        rankClass = 'rank-1';
                        rankBadge = '<div class="rank-badge">🥇 冠军</div>';
                    } else if (index === 1) {
                        rankClass = 'rank-2';
                        rankBadge = '<div class="rank-badge">🥈 亚军</div>';
                    } else if (index === 2) {
                        rankClass = 'rank-3';
                        rankBadge = '<div class="rank-badge">🥉 季军</div>';
                    }
                }

                const card = document.createElement('div');
                card.className = `card ${rankClass}`;
                
                // 领奖模式隐藏投票按钮
                const buttonsHtml = isPrizeMode ? '' : `
                        <div class="btn-group">
                            <button class="vote-btn" id="add-btn-${dishId}" ${isMaxed ? 'disabled' : ''} onclick="handleVote('${dishId}', 'add')">投一票</button>
                            <button class="unvote-btn" id="remove-btn-${dishId}" ${myVoteCount <= 0 ? 'disabled' : ''} onclick="handleVote('${dishId}', 'remove')">取消一票</button>
                        </div>`;

                card.innerHTML = `
                    ${rankBadge}
                    <img src="${encodeURI(imageUrl)}" alt="${dish.name}" loading="lazy" decoding="async"
                         onload="this.style.animation='none'; this.style.background='#eee';" 
                         onerror="handleImgError(this)">
                    <div class="card-content">
                        <div class="card-title">${dish.name || '未命名'}</div>
                        <div class="card-chef">👨‍🍳 ${chefName}</div>
                        <div class="card-date">📅 ${dishDate}</div>
                        <div class="my-vote" id="my-vote-${dishId}">我的投票：${myVoteCount} 票</div>
                        <div class="vote-count" id="count-${dishId}">总票数：<strong>${voteCount}</strong></div>
                        ${buttonsHtml}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function handleVote(dishId, action) {
            if (isPrizeMode) return;

            const usedVotes = getUsedVotes();
            if (action === 'add' && usedVotes >= MAX_VOTES) {
                alert(`您最多只能投 ${MAX_VOTES} 票，请先取消其他菜的投票！`);
                return;
            }
            if (action === 'remove' && (userVotes[dishId] || 0) <= 0) {
                alert('您还没有给这道菜投过票哦！');
                return;
            }

            const addBtn = document.getElementById(`add-btn-${dishId}`);
            const removeBtn = document.getElementById(`remove-btn-${dishId}`);
            if (addBtn) addBtn.disabled = true;
            if (removeBtn) removeBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/api/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dish_id: dishId, action: action })
                });
                const result = await response.json();
                
                if (result.success) {
                    if (action === 'add') {
                        userVotes[dishId] = (userVotes[dishId] || 0) + 1;
                    } else {
                        userVotes[dishId] = (userVotes[dishId] || 0) - 1;
                        if (userVotes[dishId] <= 0) delete userVotes[dishId];
                    }
                    localStorage.setItem('userVotes', JSON.stringify(userVotes));
                    allVotes[dishId] = result.count;

                    document.getElementById(`count-${dishId}`).innerHTML = `总票数：<strong>${result.count}</strong>`;
                    document.getElementById(`my-vote-${dishId}`).innerHTML = `我的投票：${userVotes[dishId] || 0} 票`;
                    
                    const used = getUsedVotes();
                    const isMaxed = used >= MAX_VOTES;
                    document.querySelectorAll('.vote-btn').forEach(btn => btn.disabled = isMaxed);
                    document.querySelectorAll('.unvote-btn').forEach(btn => {
                        const dId = btn.id.replace('remove-btn-', '');
                        btn.disabled = (userVotes[dId] || 0) <= 0;
                    });
                } else {
                    alert('操作失败：' + result.error);
                    if (addBtn) addBtn.disabled = false;
                    if (removeBtn) removeBtn.disabled = false;
                }
            } catch (error) {
                alert('网络请求失败，请刷新重试');
                if (addBtn) addBtn.disabled = false;
                if (removeBtn) removeBtn.disabled = false;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
