<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月度好菜投票</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { min-height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  margin: 0;
  padding: 14px;
  font-size: 16px;
  min-height: 100vh;
  background: linear-gradient(135deg, #eef2ff 0%, #f4f7f6 45%, #ecfdf5 100%);
  background-attachment: fixed;
  background-size: cover;
  background-color: #f4f7f6;
}
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 40vh;
  background: radial-gradient(ellipse at top, rgba(99,102,241,.06), transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body > * {
  position: relative;
  z-index: 1;
}

h1 { text-align: center; color: #333; font-size: 1.8em; margin: 12px 0; }

.countdown {
  text-align: center; font-weight: bold; color: #fff;
  background: linear-gradient(90deg, #ff5252, #ff9800);
  padding: 12px; border-radius: 8px; margin: 0 auto 12px;
  max-width: 480px; font-size: 1.05em;
  box-shadow: 0 2px 10px rgba(255,82,82,.35);
  letter-spacing: .5px;
  transition: background .5s ease, box-shadow .5s ease;
}
.countdown.ended { background: linear-gradient(90deg, #999, #777); box-shadow: none; font-size: 1em; }
.countdown.free  { background: linear-gradient(90deg, #4caf50, #8bc34a); box-shadow: 0 2px 10px rgba(76,175,80,.35); }
.countdown .num {
  display: inline-block; min-width: 2.2em; padding: 2px 6px; margin: 0 2px;
  background: rgba(0,0,0,.18); border-radius: 4px;
  font-variant-numeric: tabular-nums;
  font-family: "SF Mono", Menlo, Consolas, monospace;
}

.month-picker {
  display: flex; justify-content: center; align-items: center; gap: 10px;
  max-width: 480px; margin: 0 auto 12px;
  position: relative; z-index: 200;
}
.month-picker label { color: #555; font-weight: 600; font-size: .95em; flex-shrink: 0; }

.dropdown { position: relative; flex: 1; max-width: 260px; min-width: 170px; }

.dropdown-trigger {
  flex: none !important; width: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 20px;
  font-size: .95em; font-weight: 600; font-family: inherit; color: #333;
  background: #fff;
  border: 1.5px solid #e5e7eb;
  border-radius: 999px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  cursor: pointer; text-align: left;
  transition: border-color .25s ease, box-shadow .25s ease, background-color .25s ease;
}
.dropdown-trigger:active { transform: none; }
.dropdown.open .dropdown-trigger { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.15); }

.dropdown-arrow { transition: transform .3s cubic-bezier(.22,.61,.36,1); flex-shrink: 0; }
.dropdown.open .dropdown-arrow { transform: rotate(180deg); }

.dropdown-panel {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.15), 0 2px 8px rgba(0,0,0,.08);
  padding: 6px;
  max-height: 0; overflow: hidden;
  opacity: 0;
  transform: translateY(-8px) scale(0.96);
  transform-origin: top center;
  pointer-events: none;
  transition: opacity .22s ease, transform .28s cubic-bezier(.22,.61,.36,1), max-height .3s cubic-bezier(.22,.61,.36,1);
  z-index: 1000;
}
.dropdown.open .dropdown-panel { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; max-height: 320px; overflow-y: auto; }

.dropdown-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-radius: 10px;
  font-size: .92em; font-weight: 500; color: #333;
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
  user-select: none;
}
.dropdown-item.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; font-weight: 600; }
.dropdown-item.ended { opacity: .55; }
.dropdown-item .status-dot { font-size: .75em; }

.month-tip {
  text-align: center; font-weight: bold; color: #fff; background: #ff9800;
  padding: 10px; border-radius: 8px; margin: 0 auto 18px; max-width: 480px; font-size: 1em;
  transition: background .3s ease;
}
.month-tip.readonly { background: #6c757d; }
.user-info { text-align: center; color: #28a745; font-weight: bold; margin-bottom: 14px; font-size: 1em; }

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  max-width: 1400px; margin: 0 auto;
  opacity: 1; transform: translateY(0);
  transition: opacity .25s ease, transform .25s ease;
}
.grid.fading-out { opacity: 0; transform: translateY(10px); }

.card {
  background: #fff;
  border-radius: 10px; overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  display: flex; flex-direction: column;
  transition: transform .25s ease, box-shadow .25s ease, background-color .3s ease;
}
.grid.animate .card { animation: cardIn .4s cubic-bezier(.22,.61,.36,1) both; }

.card img { width: 100%; height: 200px; object-fit: cover; display: block; background: #eee; cursor: pointer; transition: transform .35s ease; }
.no-img { width: 100%; height: 200px; background: #eee; display: flex; align-items: center; justify-content: center; color: #999; font-size: 1em; }

.info { padding: 12px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
.name { font-weight: bold; color: #333; font-size: 1.15em; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chef { color: #007bff; margin: 4px 0; font-size: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date { color: #888; font-size: .9em; }
.votes {
  color: #ff9800; font-weight: bold; font-size: 1.15em; margin: 6px 0;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), color .3s ease;
}
.votes.bump { transform: scale(1.25); color: #ff5722; }
.btns { display: flex; gap: 6px; margin-top: 8px; }
button {
  flex: 1; padding: 10px 2px; border: none; border-radius: 6px; color: #fff;
  font-size: .95em; cursor: pointer; font-family: inherit; -webkit-appearance: none;
  transition: background .2s ease, transform .1s ease, opacity .2s ease;
}
.add { background: #007bff; }
.remove { background: #6c757d; }
button:disabled { background: #ccc; cursor: not-allowed; opacity: .7; }

.podium {
  background: #fff; border-radius: 12px; padding: 16px;
  margin: 0 auto 20px;
  max-width: 1080px;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  transition: opacity .25s ease, transform .25s ease;
}
.podium.fading-out { opacity: 0; transform: translateY(10px); }
.podium-title { text-align: center; color: #ff9800; font-weight: bold; margin-bottom: 14px; font-size: 1.3em; }
.podium-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.podium-card {
  border-radius: 10px; overflow: hidden; position: relative; border: 3px solid #eee; background: #fff;
  transition: box-shadow .3s ease;
}
.podium-card.r1 { border-color: #FFD700; }
.podium-card.r2 { border-color: #C0C0C0; }
.podium-card.r3 { border-color: #CD7F32; }
.podium-badge {
  position: absolute; top: 8px; left: 8px; padding: 4px 10px; border-radius: 12px;
  font-size: .85em; font-weight: bold; background: #FFD700; color: #333; z-index: 2;
}
.podium-card.r2 .podium-badge { background: #C0C0C0; }
.podium-card.r3 .podium-badge { background: #CD7F32; color: #fff; }

.podium-card img { width: 100%; height: 200px; object-fit: cover; display: block; background: #eee; }
.podium-card .no-img { width: 100%; height: 200px; }

.podium-info { padding: 12px; text-align: center; }
.podium-name { font-weight: bold; color: #333; font-size: 1.15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.podium-chef { color: #d9534f; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; font-size: 1em; }
.podium-date { color: #888; font-size: .9em; margin-top: 4px; }
.podium-votes { color: #ff9800; font-weight: bold; margin-top: 6px; font-size: 1.15em; }

.modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,.6); justify-content: center; align-items: center; opacity: 0; transition: opacity .3s ease; }
.modal.show { display: flex; opacity: 1; }
.modal-box {
  background: #fff; padding: 28px; border-radius: 12px; width: 88%; max-width: 400px; text-align: center;
  transform: scale(0.9); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
}
.modal.show .modal-box { transform: scale(1); }
.modal-box h2 { margin: 0 0 12px; color: #333; font-size: 1.4em; }
.modal-box p { color: #666; font-size: 1em; margin: 0 0 14px; }
.modal-box input {
  width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px;
  font-size: 1.05em; font-family: inherit; box-sizing: border-box; -webkit-appearance: none;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.modal-box input:focus { outline: none; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,.15); }
.modal-box button { width: 100%; padding: 13px; background: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 1.1em; margin-top: 10px; }
.err { color: #d9534f; font-size: .95em; margin-bottom: 8px; display: none; }

.viewer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,.92); z-index: 99999;
  display: flex; justify-content: center; align-items: center;
  opacity: 0; pointer-events: none; transition: opacity .3s ease;
}
.viewer.show { opacity: 1; pointer-events: auto; }
.viewer img {
  width: auto; height: auto; max-width: 92vw; max-height: 88vh;
  display: block; will-change: transform, opacity;
  border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.viewer-close {
  position: absolute; top: 15px; right: 20px;
  color: #fff; font-size: 32px; font-weight: bold;
  cursor: pointer; padding: 4px 12px; line-height: 1;
  background: rgba(255,255,255,.12); border-radius: 50%;
  transition: background .2s ease, transform .25s ease;
  z-index: 100000;
}

/* ============ ⚡ 悬浮按钮组 ============ */
.fab-group {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 9000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.fab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: .9em;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  border: none;
  -webkit-appearance: none;
  box-shadow: 0 4px 14px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.1);
  transition: transform .2s ease, box-shadow .2s ease, background-color .3s ease;
  white-space: nowrap;
}
.fab:active { transform: scale(0.95); }
.fab:hover { box-shadow: 0 6px 20px rgba(0,0,0,.2); }

.fab-power {
  background: rgba(255,255,255,.9);
  color: #555;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.fab-power.active {
  background: linear-gradient(135deg, #10b981, #059669) !important;
  color: #fff !important;
  box-shadow: 0 4px 16px rgba(16,185,129,.45) !important;
}
.fab-power .icon { font-size: 1.1em; }

.fab-admin {
  background: linear-gradient(135deg, #6366f1, #8b5cf6) !important;
  color: #fff !important;
  box-shadow: 0 4px 16px rgba(99,102,241,.45) !important;
}
.fab-admin .icon { font-size: 1.1em; }

/* ============ 👑 管理面板（FLIP 动画） ============ */
.admin-modal {
  display: none;
  position: fixed;
  z-index: 10001;
  inset: 0;
  background: rgba(0,0,0,.5);
  justify-content: center;
  align-items: center;
  padding: 16px;
  opacity: 0;
  transition: opacity .3s ease;
}
.admin-modal.show {
  display: flex;
  opacity: 1;
}
.admin-box {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 420px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  /* FLIP 动画由 JS 控制，这里不用 transition */
  will-change: transform, opacity;
  transform-origin: center center;
}
.admin-box h2 {
  margin: 0 0 16px;
  font-size: 1.3em;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
}
.admin-section {
  margin-bottom: 18px;
  padding: 14px;
  background: #f9fafb;
  border-radius: 10px;
}
.admin-section h3 {
  margin: 0 0 10px;
  font-size: .9em;
  color: #666;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.admin-device-id {
  background: #eef2ff;
  color: #4f46e5;
  padding: 10px 12px;
  border-radius: 8px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: .82em;
  word-break: break-all;
  cursor: pointer;
  user-select: all;
  margin-top: 6px;
  transition: background .2s ease;
}
.admin-device-id:hover { background: #e0e7ff; }

/* 画质选项按钮 */
.quality-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 6px;
}
.quality-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 14px;
  background: #fff;
  border: 2px solid #e5e7eb;
  border-radius: 10px;
  font-family: inherit;
  cursor: pointer;
  text-align: left;
  -webkit-appearance: none;
  transition: border-color .2s ease, background-color .2s ease, transform .1s ease;
}
.quality-btn:active { transform: scale(.98); }
.quality-btn:hover { border-color: #c7d2fe; background: #fafaff; }
.quality-btn.active {
  border-color: #6366f1;
  background: linear-gradient(135deg, #eef2ff, #f5f3ff);
  box-shadow: 0 0 0 3px rgba(99,102,241,.15);
}
.quality-btn .q-icon { font-size: 1.4em; flex-shrink: 0; }
.quality-btn .q-text { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.quality-btn .q-name { font-weight: bold; color: #333; font-size: .95em; }
.quality-btn .q-desc { font-size: .75em; color: #888; }
.quality-btn.active .q-name { color: #4f46e5; }
.quality-btn.active .q-desc { color: #6366f1; }

.admin-close {
  width: 100%;
  padding: 12px;
  background: #6366f1;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  margin-top: 6px;
  -webkit-appearance: none;
  transition: filter .2s ease;
}
.admin-close:hover { filter: brightness(1.1); }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

body.has-hover .card:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0,0,0,.12); }
body.has-hover .card img:hover { transform: scale(1.03); }
body.has-hover .dropdown-item:hover { background: #eef2ff; color: #4f46e5; }
body.has-hover button:not(:disabled):hover { filter: brightness(1.1); }
body.has-hover .viewer-close:hover { background: rgba(255,255,255,.28); transform: rotate(90deg); }
body.has-hover .podium-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,.15); }
body.has-hover button:not(:disabled):active { transform: scale(0.96); }

body.has-hover.perf-high .card {
  background: rgba(255, 255, 255, 0.62);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.8);
  box-shadow: 0 2px 10px rgba(99,102,241,.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
body.has-hover.perf-high .card:hover {
  background: rgba(255, 255, 255, 0.78);
  box-shadow: 0 12px 28px rgba(99,102,241,.16), inset 0 1px 0 rgba(255, 255, 255, 1);
}
body.has-hover.perf-high .podium {
  background: rgba(255, 255, 255, 0.62);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 4px 16px rgba(99,102,241,.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
body.has-hover.perf-high .podium-card { background: rgba(255, 255, 255, 0.7); }
body.has-hover.perf-high .dropdown-trigger {
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 1.5px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 2px 10px rgba(99,102,241,.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
body.has-hover.perf-high .dropdown-trigger:hover {
  background: rgba(255, 255, 255, 0.8);
  border-color: #c7d2fe;
  box-shadow: 0 6px 16px rgba(99,102,241,.15), inset 0 1px 0 rgba(255, 255, 255, 1);
}
body.has-hover.perf-high .dropdown.open .dropdown-trigger {
  border-color: #6366f1;
  box-shadow: 0 0 0 4px rgba(99,102,241,.18);
}
body.has-hover.perf-high .dropdown-panel {
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(24px) saturate(200%);
  -webkit-backdrop-filter: blur(24px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 12px 40px rgba(99,102,241,.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
body.has-hover.perf-high .modal-box {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.9);
}
body.has-hover.perf-high .fab-power:not(.active) {
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.9);
}

body.perf-mid .card { box-shadow: 0 1px 4px rgba(0,0,0,.06); transition: transform .2s ease; }
body.perf-mid .card img { transition: transform .25s ease; }
body.perf-mid .grid.animate .card { animation-duration: .3s; }
body.perf-mid .dropdown-panel { box-shadow: 0 6px 20px rgba(0,0,0,.12); transition: opacity .15s ease, transform .2s ease; }
body.perf-mid .podium-card { transition: none; }
body.perf-mid .viewer { transition: opacity .2s ease; }

body.perf-lite .grid { transition: none; }
body.perf-lite .grid.fading-out { opacity: 1; transform: none; }
body.perf-lite .grid.animate .card { animation: none; }
body.perf-lite .card {
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  transition: none;
  content-visibility: auto;
  contain-intrinsic-size: 240px;
}
body.perf-lite .card img { transition: none; }
body.perf-lite .votes { transition: none; }
body.perf-lite .votes.bump { transform: none; }
body.perf-lite button { transition: none; }
body.perf-lite .dropdown-trigger { transition: none; }
body.perf-lite .dropdown-arrow { transition: transform .15s linear; }
body.perf-lite .dropdown-panel { transition: opacity .15s ease; transform: none; }
body.perf-lite .dropdown.open .dropdown-panel { transform: none; }
body.perf-lite .podium { transition: none; }
body.perf-lite .podium.fading-out { opacity: 1; transform: none; }
body.perf-lite .podium-card { transition: none; }
body.perf-lite .modal { transition: none; }
body.perf-lite .modal-box { transition: none; transform: none; }
body.perf-lite .modal.show .modal-box { transform: none; }
body.perf-lite .viewer { transition: none; }
body.perf-lite .viewer-close { transition: none; }
body.perf-lite .countdown { transition: none; }
body.perf-lite .month-tip { transition: none; }

body.perf-lite .card, body.perf-lite .podium, body.perf-lite .podium-card,
body.perf-lite .dropdown-trigger, body.perf-lite .dropdown-panel, body.perf-lite .modal-box,
body.perf-mid .dropdown-trigger, body.perf-mid .dropdown-panel, body.perf-mid .modal-box,
body.is-touch .card, body.is-touch .podium, body.is-touch .podium-card,
body.is-touch .dropdown-trigger, body.is-touch .dropdown-panel, body.is-touch .modal-box {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
body.perf-lite .card, body.perf-lite .podium, body.perf-lite .podium-card,
body.perf-lite .dropdown-trigger, body.perf-lite .dropdown-panel, body.perf-lite .modal-box,
body.perf-mid .dropdown-trigger, body.perf-mid .dropdown-panel, body.perf-mid .modal-box,
body.is-touch .card, body.is-touch .podium, body.is-touch .podium-card,
body.is-touch .dropdown-trigger, body.is-touch .dropdown-panel, body.is-touch .modal-box {
  background: #fff !important;
}

body.perf-lite .fab-power:not(.active),
body.is-touch .fab-power:not(.active) {
  background: rgba(255,255,255,.95) !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  color: #555 !important;
}
body.perf-lite .fab-power.active,
body.is-touch .fab-power.active {
  background: linear-gradient(135deg, #10b981, #059669) !important;
  color: #fff !important;

<script>
// ============ 🎯 设备识别 + 性能分档 + 管理员 ============
(function detectPerformance(){
  var body = document.body;
  if (!body) return;

  // ---------- 1. 设备指纹 ----------
  function getDeviceId(){
    var saved = localStorage.getItem('device_id');
    if (saved) return saved;

    var parts = [
      navigator.userAgent,
      navigator.language || '',
      navigator.languages ? navigator.languages.join(',') : '',
      navigator.hardwareConcurrency || '',
      navigator.deviceMemory || '',
      screen.width + 'x' + screen.height,
      screen.colorDepth || '',
      new Date().getTimezoneOffset(),
      (Intl.DateTimeFormat().resolvedOptions().timeZone) || '',
      navigator.platform || ''
    ];

    try {
      var c = document.createElement('canvas');
      c.width = 200; c.height = 50;
      var ctx = c.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillStyle = '#f60';
      ctx.fillRect(125, 1, 62, 20);
      ctx.fillStyle = '#069';
      ctx.fillText('device-fp', 2, 15);
      ctx.fillStyle = 'rgba(102,204,0,0.7)';
      ctx.fillText('device-fp', 4, 17);
      parts.push(c.toDataURL().slice(-80));
    } catch(e){}

    var str = parts.join('||');
    var h1 = 0x811c9dc5;
    for (var i = 0; i < str.length; i++){
      h1 ^= str.charCodeAt(i);
      h1 = (h1 * 0x01000193) >>> 0;
    }
    var h2 = 5381;
    for (var i = 0; i < str.length; i++){
      h2 = ((h2 << 5) + h2 + str.charCodeAt(i)) >>> 0;
    }
    var id = 'dev-' + h1.toString(36) + h2.toString(36);
    localStorage.setItem('device_id', id);
    return id;
  }

  var DEVICE_ID = getDeviceId();

  // ---------- 2. 管理员白名单 ----------
  var ADMIN_IDS = [
    'dev-msw0i6up35xnt3nk4a',
    '154bde98eb07421f81d75657af6e7f12',
    'dev-154bde98eb07421f81d75657af6e7f12',
  ];

  var isAdmin = ADMIN_IDS.indexOf(DEVICE_ID) !== -1;

  // ---------- 3. hover / touch ----------
  var hasHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  body.classList.add(hasHover ? 'has-hover' : 'is-touch');

  // ---------- 4. 自动性能档 ----------
  var autoLevel = 'perf-lite';
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var mem = navigator.deviceMemory;
    var cores = navigator.hardwareConcurrency || 2;
    if (mem === undefined) {
      autoLevel = cores >= 8 ? 'perf-high' : cores >= 4 ? 'perf-mid' : 'perf-lite';
    } else if (mem >= 8) {
      autoLevel = 'perf-high';
    } else if (mem === 4) {
      autoLevel = cores >= 4 ? 'perf-high' : 'perf-mid';
    } else if (mem >= 2) {
      autoLevel = 'perf-mid';
    } else {
      autoLevel = 'perf-lite';
    }
  }

  // ---------- 5. 最终档位（force_perf 优先） ----------
  var forcePerf = localStorage.getItem('force_perf') || '';
  var userLite = localStorage.getItem('perf_lite') === '1';

  var finalLevel;
  if (forcePerf === 'perf-high' || forcePerf === 'perf-mid' || forcePerf === 'perf-lite') {
    finalLevel = forcePerf;
  } else if (userLite) {
    finalLevel = 'perf-lite';
  } else {
    finalLevel = autoLevel;
  }

  body.classList.add(finalLevel);

  console.log('[设备] id=' + DEVICE_ID + ' admin=' + isAdmin +
              ' 自动档=' + autoLevel + ' force=' + (forcePerf || '—') +
              ' 省电=' + userLite + ' 最终=' + finalLevel);

  window.__DEVICE__ = {
    id: DEVICE_ID,
    isAdmin: isAdmin,
    autoLevel: autoLevel,
    forcePerf: forcePerf,
    userLite: userLite,
    finalLevel: finalLevel
  };

  // ---------- 6. 统一设置档位 ----------
  function setLevel(level, saveAs){
    // 清除旧档
    body.classList.remove('perf-high', 'perf-mid', 'perf-lite');
    body.classList.add(level);

    // 保存设置
    if (saveAs === 'force'){
      localStorage.setItem('force_perf', level);
      if (level === 'perf-lite') localStorage.setItem('perf_lite', '1');
      else localStorage.removeItem('perf_lite');
    } else if (saveAs === 'power'){
      if (level === 'perf-lite') {
        localStorage.setItem('perf_lite', '1');
        localStorage.removeItem('force_perf');
      } else {
        localStorage.removeItem('perf_lite');
        localStorage.removeItem('force_perf');
      }
    }

    // 更新 UI
    refreshPowerBtn();
    updateQualityUI();

    console.log('[档位切换] → ' + level + ' (saveAs=' + saveAs + ')');
  }

  // ---------- 7. 省电模式按钮 ----------
  var btnPower = document.getElementById('btn-power');
  function refreshPowerBtn(){
    var isLite = body.classList.contains('perf-lite');
    var textEl = btnPower.querySelector('.text');
    if (isLite){
      btnPower.classList.add('active');
      if (textEl) textEl.textContent = '省电模式已开启';
    } else {
      btnPower.classList.remove('active');
      if (textEl) textEl.textContent = '省电模式';
    }
  }
  refreshPowerBtn();

  btnPower.addEventListener('click', function(){
    var isLite = body.classList.contains('perf-lite');
    var next = isLite ? autoLevel : 'perf-lite';
    setLevel(next, 'power');
  });

  // ---------- 8. 管理面板 ----------
  var btnAdmin = document.getElementById('btn-admin');
  var adminModal = document.getElementById('admin-modal');
  var adminBox = document.getElementById('admin-box');
  var adminClose = document.getElementById('admin-close');

  function updateQualityUI(){
    var current = body.classList.contains('perf-high') ? 'perf-high' :
                  body.classList.contains('perf-mid') ? 'perf-mid' : 'perf-lite';
    var btns = document.querySelectorAll('.quality-btn');
    for (var i = 0; i < btns.length; i++){
      btns[i].classList.toggle('active', btns[i].getAttribute('data-perf') === current);
    }
  }

  if (isAdmin && btnAdmin && adminModal && adminBox){
    btnAdmin.style.display = '';

    // 填充设备信息
    function fillAdminPanel(){
      var elId = document.getElementById('admin-device-id');
      if (elId) elId.textContent = window.__DEVICE__.id;
      updateQualityUI();
    }

    // ============ 🖼️ FLIP 动画打开 ============
    function openAdminModal(){
      fillAdminPanel();

      // 拿到 👑 按钮的位置
      var from = btnAdmin.getBoundingClientRect();

      // 先显示 modal（此时 opacity 从 0 开始，背景淡入）
      adminModal.classList.add('show');

      // 下一帧：拿 box 最终位置 + 设为起始状态
      requestAnimationFrame(function(){
        var to = adminBox.getBoundingClientRect();
        if (to.width === 0 || to.height === 0) return;

        var cx1 = from.left + from.width / 2;
        var cy1 = from.top + from.height / 2;
        var cx2 = to.left + to.width / 2;
        var cy2 = to.top + to.height / 2;
        var dx = cx1 - cx2;
        var dy = cy1 - cy2;
        var scale = Math.max(0.1, from.width / to.width);

        // 立即设为起始状态（禁用过渡）
        adminBox.style.transition = 'none';
        adminBox.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ')';
        adminBox.style.opacity = '0.6';

        void adminBox.offsetWidth;

        // 下一帧开始飞行动画
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            adminBox.style.transition = 'transform .45s cubic-bezier(.34,1.15,.64,1), opacity .3s ease';
            adminBox.style.transform = 'translate(0, 0) scale(1)';
            adminBox.style.opacity = '1';
          });
        });
      });
    }

    // ============ 🖼️ FLIP 动画关闭 ============
    function closeAdminModal(){
      var from = btnAdmin.getBoundingClientRect();
      var to = adminBox.getBoundingClientRect();

      var cx1 = from.left + from.width / 2;
      var cy1 = from.top + from.height / 2;
      var cx2 = to.left + to.width / 2;
      var cy2 = to.top + to.height / 2;
      var dx = cx1 - cx2;
      var dy = cy1 - cy2;
      var scale = Math.max(0.1, from.width / to.width);

      adminBox.style.transition = 'transform .35s cubic-bezier(.4,0,.6,1), opacity .3s ease';
      adminBox.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ')';
      adminBox.style.opacity = '0';

      adminModal.classList.remove('show');

      setTimeout(function(){
        adminBox.style.transition = '';
        adminBox.style.transform = '';
        adminBox.style.opacity = '';
      }, 400);
    }

    // 打开
    btnAdmin.addEventListener('click', function(e){
      e.stopPropagation();
      openAdminModal();
    });

    // 关闭按钮
    adminClose.addEventListener('click', closeAdminModal);

    // 点击遮罩关闭
    adminModal.addEventListener('click', function(e){
      if (e.target === adminModal) closeAdminModal();
    });

    // ESC 关闭
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && adminModal.classList.contains('show')){
        closeAdminModal();
      }
    });

    // 画质切换
    var qualityBtns = document.querySelectorAll('.quality-btn');
    for (var i = 0; i < qualityBtns.length; i++){
      (function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var level = btn.getAttribute('data-perf');
          if (!level) return;
          setLevel(level, 'force');
        });
      })(qualityBtns[i]);
    }

    // 设备 ID 点击复制
    var elId = document.getElementById('admin-device-id');
    if (elId){
      elId.addEventListener('click', function(){
        var txt = elId.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(function(){
            var orig = txt;
            elId.textContent = '✅ 已复制：' + orig;
            setTimeout(function(){ elId.textContent = orig; }, 1500);
          });
        } else {
          var ta = document.createElement('textarea');
          ta.value = txt;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch(e){}
          document.body.removeChild(ta);
          var orig = txt;
          elId.textContent = '✅ 已复制：' + orig;
          setTimeout(function(){ elId.textContent = orig; }, 1500);
        }
      });
    }
  }
})();
</script>

  var lastOpenState = null;

  function updateCountdown(){

    if (diff <= 0){

      if ($('grid').children.length > 0) render();

    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins  = Math.floor((diff % 3600000) / 60000);
    var secs  = Math.floor((diff % 60000) / 1000);

    el.className = 'countdown';
    el.innerHTML =
      '⏰ ' + currentMonth + ' 投票还剩 ' +
      '<span class="num">' + days + '</span>天 ' +

      '<span class="num">' + pad2(secs) + '</span>';
  }

  function renderMonthSelect(months){

    var trigger = $('month-trigger');

    if (!trigger._bound){
      trigger._bound = true;

        if (!dropdown.contains(e.target)) dropdown.classList.remove('open');
      });
      document.addEventListener('keydown', function(e){
        if (e.key === 'Escape') dropdown.classList.remove('open');
      });
    }

    rebuildPanel();
  }

  function rebuildPanel(){
    var panel = $('month-panel');
    if (!panel) return;
    panel.innerHTML = '';
    appendItem(panel, '', '全部月份（汇总）', null);
    _monthList.forEach(function(m){
      var info = monthDeadlines[m];
      var open = info ? info.open !== false : true;
      appendItem(panel, m, m, open);
    });
  }

  function appendItem(panel, value, label, open){
    var item = document.createElement('div');
    item.className = 'dropdown-item';
    if (value === currentMonth) item.classList.add('active');
    if (open === false) item.classList.add('ended');
    item.setAttribute('data-value', value);

    var text = document.createElement('span');
    text.textContent = label;
    item.appendChild(text);

    if (open !== null){
      var dot = document.createElement('span');
      dot.className = 'status-dot';
      dot.textContent = open === false ? '🔴' : '🟢';
      item.appendChild(dot);
    }

    item.onclick = function(e){
      e.stopPropagation();
      $('month-dropdown').classList.remove('open');
      if (value === currentMonth) return;
      loadMonth(value);
    };

    panel.appendChild(item);
  }

  function updateMonthSelectUI(){
    var label = $('month-label');
    if (label) label.textContent = currentMonth || '全部月份（汇总）';
    var panel = $('month-panel');
    if (panel){
      var items = panel.querySelectorAll('.dropdown-item');
      for (var i = 0; i < items.length; i++){
        var v = items[i].getAttribute('data-value');
        items[i].classList.toggle('active', v === currentMonth);
        var info = monthDeadlines[v];
        if (v && info){
          items[i].classList.toggle('ended', info.open === false);
          var dot = items[i].querySelector('.status-dot');
          if (dot) dot.textContent = info.open === false ? '🔴' : '🟢';
        }
      }
    }
  }

  function loadMonth(month){
    var grid = $('grid');
    var podium = $('podium');

    if (!isLowEnd()){
      grid.classList.add('fading-out');
      if (podium.style.display !== 'none') podium.classList.add('fading-out');
    }

    var doUpdate = function(){
      currentMonth = month || '';
      var tip = $('month-tip');

      if (!currentMonth){
        dishes = allDishesCache.slice();
        tip.textContent = '📅 全部菜品展示（共 ' + dishes.length + ' 道）· 仅供浏览';
        tip.classList.add('readonly');
      } else {
        dishes = allDishesCache.filter(function(d){
          return (d.date || '').indexOf(currentMonth) === 0;
        });
        tip.textContent = '📅 ' + currentMonth + ' 菜品（共 ' + dishes.length + ' 道）';
        tip.classList.remove('readonly');
      }

      updateMonthSelectUI();

      if (!currentMonth){
        DEADLINE = null;
        lastOpenState = null;
        dishes.sort(function(a, b){ return (a.date || '').localeCompare(b.date || ''); });
        updateCountdown();

        if (!isLowEnd()){
          _animNextRender = true;
          grid.classList.add('animate');
          setTimeout(function(){ grid.classList.remove('animate'); }, 900);
        }

        render();

        if (!isLowEnd()){
          requestAnimationFrame(function(){
            grid.classList.remove('fading-out');
            podium.classList.remove('fading-out');
          });
        }
        return;
      }

      var url = API + '/api/vote_status?month=' + encodeURIComponent(currentMonth);

      fetch(url)
        .then(function(r){ return r.json(); })
        .then(function(s){
          if (s.deadline){
            var t = Date.parse(s.deadline);
            if (isNaN(t)) t = Date.parse(s.deadline.replace(/\+08:00$/, ''));
            DEADLINE = isNaN(t) ? null : t;
          } else {
            DEADLINE = null;
          }
          lastOpenState = null;
        })
        .catch(function(){
          DEADLINE = null;
          lastOpenState = null;
        })
        .then(function(){
          dishes.sort(function(a, b){ return (a.date || '').localeCompare(b.date || ''); });
          updateCountdown();

          if (!isLowEnd()){
            _animNextRender = true;
            grid.classList.add('animate');
            setTimeout(function(){ grid.classList.remove('animate'); }, 900);
          }

          loadVotes();

          if (!isLowEnd()){
            requestAnimationFrame(function(){
              grid.classList.remove('fading-out');
              podium.classList.remove('fading-out');
            });
          }
        });
    };

    if (isLowEnd()) doUpdate();
    else setTimeout(doUpdate, 250);
  }

  function render(){
    var g = $('grid');
    g.innerHTML = '';
    var voteOpen = isVoteOpen();
    var maxed = getTotalVoted() >= 3;
    var playAnim = _animNextRender;
    _animNextRender = false;
    var lowEnd = isLowEnd();

    var readonly = isAllMonthsView();

    var oldVotes = {};
    for (var k in votes) { oldVotes[k] = votes[k]; }

    for (var i = 0; i < dishes.length; i++){
      var d = dishes[i];
      var id = String(d.id);
      var url = imgUrl(d.img);
      var my = getVote(id);
      var total = votes[id] || 0;

      var card = document.createElement('div');
      card.className = 'card';
      if (playAnim && !lowEnd) {
        card.style.animationDelay = (i * 0.03) + 's';
      }

      var imgEl;
      if (url){
        imgEl = document.createElement('img');
        imgEl.src = url;
        imgEl.loading = 'lazy';
        imgEl.decoding = 'async';
        imgEl.onerror = function(){
          var ph = document.createElement('div');
          ph.className = 'no-img';
          ph.textContent = '暂无图片';
          if (this.parentNode) this.parentNode.replaceChild(ph, this);
        };
        (function(el, u){ el.onclick = function(){ openViewer(el, u); }; })(imgEl, url);
      } else {
        imgEl = document.createElement('div');
        imgEl.className = 'no-img';
        imgEl.textContent = '暂无图片';
      }
      card.appendChild(imgEl);

      var info = document.createElement('div');
      info.className = 'info';

      var nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = d.name || '';
      info.appendChild(nameEl);

      var chefEl = document.createElement('div');
      chefEl.className = 'chef';
      chefEl.textContent = '👨‍🍳 ' + chefName(d);
      info.appendChild(chefEl);

      var dateEl = document.createElement('div');
      dateEl.className = 'date';
      dateEl.textContent = '📅 ' + fmtDate(d.date);
      info.appendChild(dateEl);

      if (!readonly){
        var votesEl = document.createElement('div');
        votesEl.className = 'votes';
        votesEl.id = 'v-' + id;
        votesEl.textContent = total + ' 票';
        if (oldVotes[id] !== undefined && oldVotes[id] !== total && !lowEnd){
          votesEl.classList.add('bump');
          setTimeout((function(el){ return function(){ el.classList.remove('bump'); }; })(votesEl), 400);
        }
        info.appendChild(votesEl);

        var btns = document.createElement('div');
        btns.className = 'btns';

        var addBtn = document.createElement('button');
        addBtn.className = 'add';
        addBtn.type = 'button';
        addBtn.textContent = voteOpen ? '投一票' : '已结束';
        if (maxed || !voteOpen) addBtn.disabled = true;
        addBtn.setAttribute('data-id', id);
        addBtn.setAttribute('data-act', 'add');
        btns.appendChild(addBtn);

        var rmBtn = document.createElement('button');
        rmBtn.className = 'remove';
        rmBtn.type = 'button';
        rmBtn.textContent = '取消';
        if (my <= 0 || !voteOpen) rmBtn.disabled = true;
        rmBtn.setAttribute('data-id', id);
        rmBtn.setAttribute('data-act', 'remove');
        btns.appendChild(rmBtn);

        info.appendChild(btns);
      }

      card.appendChild(info);
      g.appendChild(card);
    }
    renderPodium();
    $('user-info').textContent = user ? '当前用户：' + user.name + '（已投 ' + getTotalVoted() + '/3 票）' : '';
  }

  function renderPodium(){
    var p = $('podium'), g = $('podium-grid');
    if (isAllMonthsView()){
      p.style.display = 'none';
      return;
    }

    var arr = [];
    for (var i = 0; i < dishes.length; i++){
      var d = dishes[i];
      var v = votes[String(d.id)] || 0;
      if (v > 0) arr.push({ dish: d, votes: v });
    }
    arr.sort(function(a, b){ return b.votes - a.votes; });
    var top = arr.slice(0, 3);
    if (top.length === 0){ p.style.display = 'none'; return; }
    p.style.display = 'block';
    g.innerHTML = '';
    for (var i = 0; i < top.length; i++){
      var it = top[i], d = it.dish, url = imgUrl(d.img);
      var rank = i + 1;
      var badge = rank === 1 ? '🥇 第一' : rank === 2 ? '🥈 第二' : '🥉 第三';
      var card = document.createElement('div');
      card.className = 'podium-card r' + rank;

      var badgeEl = document.createElement('div');
      badgeEl.className = 'podium-badge';
      badgeEl.textContent = badge;
      card.appendChild(badgeEl);

      if (url){
        var img = document.createElement('img');
        img.src = url;
        img.onerror = function(){
          var ph = document.createElement('div');
          ph.className = 'no-img';
          ph.textContent = '暂无图片';
          if (this.parentNode) this.parentNode.replaceChild(ph, this);
        };
        card.appendChild(img);
      } else {
        var ph = document.createElement('div');
        ph.className = 'no-img';
        ph.textContent = '暂无图片';
        card.appendChild(ph);
      }

      var info = document.createElement('div');
      info.className = 'podium-info';
      info.innerHTML = '<div class="podium-name">🍽️ ' + (d.name || '') + '</div>' +
                       '<div class="podium-chef">👨‍🍳 ' + chefName(d) + '</div>' +
                       '<div class="podium-date">📅 ' + fmtDate(d.date) + '</div>' +
                       '<div class="podium-votes">' + it.votes + ' 票</div>';
      card.appendChild(info);
      g.appendChild(card);
    }
  }

  function showModal(){ $('modal').className = 'modal show'; }
  function hideModal(){ $('modal').className = 'modal'; }

  function submitRegister(){
    var phone = $('in-phone').value.trim();
    var name = $('in-name').value.trim();
    var err = $('err');
    err.style.display = 'none';
    if (!phone){ err.textContent = '手机号不能为空'; err.style.display = 'block'; return; }

    var btn = $('btn-reg');
    btn.disabled = true;
    btn.textContent = '处理中...';

    fetch(API + '/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, phone: phone })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      btn.disabled = false;
      btn.textContent = '登录 / 注册';
      if (data.success){
        user = { name: data.name, phone: phone, votes: data.votedDishes || {} };
        localStorage.setItem('chef_user', JSON.stringify(user));
        hideModal();
        render();
      } else {
        err.textContent = data.error || '失败';
        err.style.display = 'block';
      }
    })
    .catch(function(){
      btn.disabled = false;
      btn.textContent = '登录 / 注册';
      err.textContent = '网络错误，请重试';
      err.style.display = 'block';
    });
  }

  function doVote(id, act, btn){
    if (isAllMonthsView()){
      alert('全部月份视图仅供浏览，请先选择具体月份投票');
      return;
    }
    if (!isVoteOpen()){
      alert('本次投票已结束！');
      render();
      return;
    }
    if (!user){ showModal(); return; }
    if (act === 'add' && getTotalVoted() >= 3){ alert('您最多只能投3票，请先取消其他菜的投票'); return; }

    btn.disabled = true;
    var oldText = btn.textContent;
    btn.textContent = '...';

    fetch(API + '/api/vote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dish_id: id, action: act, phone: user.phone })
    })
    .then(function(r){
      return r.json().then(function(j){ return { status: r.status, data: j }; });
    })
    .then(function(res){
      btn.disabled = false;
      btn.textContent = oldText;
      var data = res.data;
      if (data.success){
        votes[id] = data.count;
        user.votes = data.myVotes || {};
        localStorage.setItem('chef_user', JSON.stringify(user));
        render();
      } else {
        alert(data.error || '失败');
        if (res.status === 403){
          if (DEADLINE !== null) DEADLINE = Math.min(DEADLINE, Date.now() - 1);
          updateCountdown();
          render();
        }
      }
    })
    .catch(function(){
      btn.disabled = false;
      btn.textContent = oldText;
      alert('网络错误，请重试');
    });
  }

  var viewer = $('viewer');
  var viewerImg = $('viewer-img');
  var _lastTriggerEl = null;

  function openViewer(triggerEl, url){
    _lastTriggerEl = triggerEl;

    var from = triggerEl.getBoundingClientRect();

    viewer.classList.add('show');
    viewerImg.style.opacity = '0';
    viewerImg.style.transform = '';
    viewerImg.style.transition = 'none';
    viewerImg.src = url;

    var startFly = function(){
      var to = viewerImg.getBoundingClientRect();
      if (to.width === 0 || to.height === 0){
        viewerImg.style.opacity = '1';
        return;
      }

      var cx1 = from.left + from.width / 2;
      var cy1 = from.top + from.height / 2;
      var cx2 = to.left + to.width / 2;
      var cy2 = to.top + to.height / 2;
      var dx = cx1 - cx2;
      var dy = cy1 - cy2;
      var scale = from.width / to.width;

      viewerImg.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ')';
      viewerImg.style.opacity = '0.6';

      void viewerImg.offsetWidth;

      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          viewerImg.style.transition = 'transform .45s cubic-bezier(.34,1.15,.64,1), opacity .25s ease';
          viewerImg.style.transform = 'translate(0, 0) scale(1)';
          viewerImg.style.opacity = '1';
        });
      });
    };

    if (viewerImg.complete && viewerImg.naturalWidth > 0){
      requestAnimationFrame(function(){
        requestAnimationFrame(startFly);
      });
    } else {
      viewerImg.onload = function(){
        viewerImg.onload = null;
        requestAnimationFrame(startFly);
      };
      viewerImg.onerror = function(){
        viewerImg.onerror = null;
        viewerImg.style.opacity = '1';
      };
    }
  }

  function closeViewer(){
    var trigger = _lastTriggerEl;

    if (!trigger || !viewerImg.src || !viewerImg.offsetParent){
      viewer.classList.remove('show');
      setTimeout(function(){
        viewerImg.src = '';
        viewerImg.style.transition = '';
        viewerImg.style.transform = '';
        viewerImg.style.opacity = '';
      }, 300);
      _lastTriggerEl = null;
      return;
    }

    var from = trigger.getBoundingClientRect();
    var to = viewerImg.getBoundingClientRect();

    var cx1 = from.left + from.width / 2;
    var cy1 = from.top + from.height / 2;
    var cx2 = to.left + to.width / 2;
    var cy2 = to.top + to.height / 2;
    var dx = cx1 - cx2;
    var dy = cy1 - cy2;
    var scale = from.width / to.width;

    viewerImg.style.transition = 'transform .35s cubic-bezier(.4,0,.6,1), opacity .3s ease';
    viewerImg.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ')';
    viewerImg.style.opacity = '0.2';

    viewer.classList.remove('show');

    setTimeout(function(){
      viewerImg.src = '';
      viewerImg.style.transition = '';
      viewerImg.style.transform = '';
      viewerImg.style.opacity = '';
      _lastTriggerEl = null;
    }, 380);
  }

  $('viewer-close').onclick = closeViewer;
  viewer.onclick = function(e){ if (e.target === viewer) closeViewer(); };
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && viewer.classList.contains('show')) closeViewer();
  });

  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || t.tagName.toLowerCase() !== 'button') return;
    if (t.classList && t.classList.contains('dropdown-trigger')) return;
    if (t.classList && t.classList.contains('fab')) return;
    if (t.classList && t.classList.contains('quality-btn')) return;
    if (t.classList && t.classList.contains('admin-close')) return;
    var id = t.getAttribute('data-id');
    var act = t.getAttribute('data-act');
    if (id && act) doVote(id, act, t);
  }, false);

  $('btn-reg').onclick = submitRegister;

  function init(){
    setInterval(updateCountdown, 1000);

    fetch(API + '/api/dishes')
      .then(function(r){ return r.json(); })
      .then(function(all){
        allDishesCache = all || [];

        var monthSet = {};
        allDishesCache.forEach(function(d){
          var m = (d.date || '').slice(0, 7);
          if (m) monthSet[m] = true;
        });
        var months = Object.keys(monthSet).sort();

        return fetch(API + '/api/vote_status')
          .then(function(r){ return r.json(); })
          .then(function(s){
            monthDeadlines = s.deadlines || {};
            renderMonthSelect(months);

            return fetch(API + '/api/current_month')
              .then(function(r){ return r.json(); })
              .then(function(m){
                var target = (m.month || '').trim();
                if (target && months.indexOf(target) !== -1) return target;
                var openMonths = months.filter(function(mm){
                  var info = monthDeadlines[mm];
                  return info && info.open !== false;
                });
                if (openMonths.length > 0) return openMonths[openMonths.length - 1];
                if (months.length > 0) return months[months.length - 1];
                return '';
              });
          });
      })
      .then(function(target){
        loadMonth(target);
      })
      .catch(function(){
        $('month-tip').textContent = '📅 加载失败，请刷新';
        updateCountdown();
      });
  }

  function loadVotes(){
    fetch(API + '/api/votes')
      .then(function(r){ return r.json(); })
      .then(function(v){
        votes = v || {};
        render();
        if (user) refreshUserVotes();
        else showModal();
      })
      .catch(function(){
        render();
        if (!user) showModal();
      });
  }

  function refreshUserVotes(){
    if (!user) return;
    fetch(API + '/api/user_votes?phone=' + encodeURIComponent(user.phone))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.success){
          user.votes = d.votedDishes || {};
          localStorage.setItem('chef_user', JSON.stringify(user));
          render();
        }
      })
      .catch(function(){});
  }

  setInterval(function(){
    if (document.hidden) return;
    fetch(API + '/api/votes')
      .then(function(r){ return r.json(); })
      .then(function(v){
        var changed = false;
        for (var k in v){
          if (v[k] !== votes[k]){ changed = true; break; }
        }
        if (changed){ votes = v; render(); }
      })
      .catch(function(){});

    fetch(API + '/api/vote_status')
      .then(function(r){ return r.json(); })
      .then(function(s){
        monthDeadlines = s.deadlines || {};
        rebuildPanel();
        updateMonthSelectUI();
      })
      .catch(function(){});
  }, 15000);

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
