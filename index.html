<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月度好菜投票系统</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .podium-section { background: white; border-radius: 16px; padding: 15px; margin-bottom: 30px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .podium-title { text-align: center; color: #ff9800; font-size: 1.3em; font-weight: bold; margin-bottom: 15px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .podium-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .podium-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.15); position: relative; border: 3px solid transparent; animation: fadeInUp 0.6s ease-out; }
        .podium-card.rank-1 { border-color: #FFD700; }
        .podium-card.rank-2 { border-color: #C0C0C0; }
        .podium-card.rank-3 { border-color: #CD7F32; }
        .podium-badge { position: absolute; top: 8px; left: 8px; padding: 4px 10px; border-radius: 15px; font-weight: bold; color: #333; z-index: 10; font-size: 0.8em; }
        .podium-badge.rank-1 { background: #FFD700; }
        .podium-badge.rank-2 { background: #C0C0C0; }
        .podium-badge.rank-3 { background: #CD7F32; color: white; }
        .podium-content { padding: 15px; text-align: center; }
        .podium-chef-name { font-size: 1.3em; font-weight: bold; color: #d9534f; margin-bottom: 5px; }
        .podium-votes { font-size: 1.2em; color: #ff9800; font-weight: bold; }

        .vote-section-title { text-align: center; color: #333; font-size: 1.2em; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; text-align: center; }
        .card-title { font-size: 1.2em; font-weight: bold; color: #333; margin-bottom: 5px; }
        .card-chef { font-size: 0.9em; color: #007bff; margin-bottom: 5px; font-weight: bold; }
        .card-date { font-size: 0.8em; color: #888; margin-bottom: 10px; }
        .my-vote { font-size: 0.9em; color: #28a745; margin-bottom: 5px; font-weight: bold; }
        .vote-count { color: #666; margin-bottom: 15px; font-size: 1.1em; }
        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        .vote-btn { flex: 1; background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9em; }
        .vote-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .unvote-btn { flex: 1; background-color: #6c757d; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9em; }
        .unvote-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        /* 登录注册弹窗 */
        .modal-overlay { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
        .modal-box h2 { margin-top: 0; color: #333; }
        .modal-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .modal-box button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1em; margin-top: 10px; }
        .modal-box .error-msg { color: red; font-size: 0.9em; margin-bottom: 10px; display: none; }

        @media (max-width: 768px) {
            body { padding: 8px; }
            h1 { font-size: 1.3em; }
            .podium-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 5px !important; }
            .podium-chef-name { font-size: 0.8em !important; }
            .podium-votes { font-size: 0.7em !important; }
            .grid { grid-template-columns: repeat(3, 1fr) !important; gap: 5px !important; }
            .card { padding: 8px 4px !important; }
            .card-title { font-size: 0.75em !important; }
            .card-chef { font-size: 0.55em !important; }
            .card-date { font-size: 0.5em !important; }
            .my-vote { font-size: 0.5em !important; }
            .vote-count { font-size: 0.6em !important; }
            .btn-group { flex-direction: column; gap: 4px; }
            .vote-btn, .unvote-btn { padding: 6px 0 !important; font-size: 0.6em !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ 月度好菜投票</h1>
        <div style="text-align: center; margin-bottom: 15px;">
            <span id="user-info" style="font-weight: bold; color: #28a745;"></span>
        </div>
        <div class="podium-section" id="podium-section" style="display: none;">
            <div class="podium-title">🏆 票数最高的前三名 🏆</div>
            <div class="podium-grid" id="podium-grid"></div>
        </div>
        <div class="vote-section-title">🗳️ 全部菜品投票（每人限3票）</div>
        <div class="grid" id="dish-grid"></div>
    </div>

    <!-- 登录/注册弹窗 -->
    <div id="register-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>身份验证</h2>
            <p style="color:#666; font-size:0.9em;">请先注册</p>
            <input type="text" id="reg-name" placeholder="请输入姓名">
            <input type="tel" id="reg-phone" placeholder="请输入手机号">
            <div id="reg-error" class="error-msg"></div>
            <button onclick="submitRegister()">注册并登录</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://hurricane-lightbox-funky-kitchen.trycloudflare.com'; 
        let allVotes = {};
        let dishesData = [];
        let userVotes = {}; // 当前用户投的票
        let totalVoted = 0; // 当前用户投的总票数
        let currentUser = JSON.parse(localStorage.getItem('chef_user')) || null; // {name, phone}

        function getChefName(dish) {
            if (dish.chef1 && dish.chef2) return `${dish.chef1} & ${dish.chef2}`;
            if (dish.chef1) return dish.chef1;
            if (dish.chef2) return dish.chef2;
            return '未知厨师';
        }

        async function init() {
            try {
                const [dishesRes, votesRes] = await Promise.all([
                    fetch(`${API_BASE_URL}/api/dishes`), 
                    fetch(`${API_BASE_URL}/api/votes`)
                ]);
                dishesData = await dishesRes.json();
                allVotes = await votesRes.json();
                dishesData.sort((a, b) => (new Date(a.date || 0) - new Date(b.date || 0)));
                
                if (currentUser) {
                    await fetchUserVotes();
                }
                
                updatePodium(); 
                renderDishes();
                setInterval(autoRefreshVotes, 15000);
            } catch (error) {
                console.error('初始化失败:', error);
                document.getElementById('dish-grid').innerHTML = '<p style="text-align:center;color:red;">数据加载失败，请刷新重试</p>';
            }
        }

        async function fetchUserVotes() {
            if (!currentUser) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/user_votes?phone=${currentUser.phone}`);
                const data = await res.json();
                if (data.success) {
                    userVotes = data.votedDishes || {};
                    totalVoted = Object.values(userVotes).reduce((a, b) => a + b, 0);
                    document.getElementById('user-info').textContent = `当前用户：${data.name} (已投 ${totalVoted}/3 票)`;
                } else {
                    // 用户不存在，清除本地存储
                    localStorage.removeItem('chef_user');
                    currentUser = null;
                }
            } catch (e) { console.error('获取用户票数失败', e); }
        }

        // 弹出注册窗口
        function showRegisterModal() {
            document.getElementById('register-modal').style.display = 'flex';
        }

        async function submitRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const errorEl = document.getElementById('reg-error');
            errorEl.style.display = 'none';

            if (!name || !phone) {
                errorEl.textContent = "姓名和手机号不能为空";
                errorEl.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone })
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = { name, phone };
                    localStorage.setItem('chef_user', JSON.stringify(currentUser));
                    userVotes = data.votedDishes || {};
                    totalVoted = Object.values(userVotes).reduce((a, b) => a + b, 0);
                    document.getElementById('register-modal').style.display = 'none';
                    document.getElementById('user-info').textContent = `当前用户：${name} (已投 ${totalVoted}/3 票)`;
                    updateUIAfterVote(); // 刷新界面
                } else {
                    errorEl.textContent = data.error;
                    errorEl.style.display = 'block';
                }
            } catch (e) {
                errorEl.textContent = "网络错误，请重试";
                errorEl.style.display = 'block';
            }
        }

        async function autoRefreshVotes() {
            if (document.hidden) return;
            try {
                const votesRes = await fetch(`${API_BASE_URL}/api/votes`);
                const newVotes = await votesRes.json();
                let changed = false;
                for (const [id, count] of Object.entries(newVotes)) {
                    if (allVotes[id] !== count) { allVotes[id] = count; changed = true; }
                }
                if (changed) {
                    dishesData.forEach(dish => {
                        const dishId = String(dish.id);
                        const countEl = document.getElementById(`count-${dishId}`);
                        if (countEl) countEl.innerHTML = `总票数：<strong>${allVotes[dishId] || 0}</strong>`;
                    });
                    updatePodium();
                }
            } catch (e) { console.error('自动刷新失败:', e); }
        }

        function updatePodium() {
            const sortedByVotes = [...dishesData].map(d => ({ ...d, votes: allVotes[String(d.id)] || 0 })).filter(d => d.votes > 0).sort((a, b) => b.votes - a.votes);
            const topThree = sortedByVotes.slice(0, 3);
            const podiumSection = document.getElementById('podium-section');
            const podiumGrid = document.getElementById('podium-grid');
            if (topThree.length === 0) { podiumSection.style.display = 'none'; return; }
            podiumSection.style.display = 'block';
            const newSignature = topThree.map(d => `${d.id}-${d.votes}`).join(',');
            if (podiumGrid.dataset.signature !== newSignature) {
                podiumGrid.dataset.signature = newSignature;
                podiumGrid.innerHTML = '';
                topThree.forEach((dish, index) => {
                    const rank = index + 1;
                    const badgeText = rank === 1 ? '🥇 第一' : rank === 2 ? '🥈 第二' : '🥉 第三';
                    const card = document.createElement('div');
                    card.className = `podium-card rank-${rank}`;
                    card.innerHTML = `
                        <div class="podium-badge rank-${rank}">${badgeText}</div>
                        <div class="podium-content">
                            <div class="podium-chef-name">👨‍🍳 ${getChefName(dish)}</div>
                            <div class="podium-votes">${dish.votes} 票</div>
                        </div>`;
                    podiumGrid.appendChild(card);
                });
            } else {
                const cards = podiumGrid.querySelectorAll('.podium-card');
                topThree.forEach((dish, index) => {
                    if (cards[index]) {
                        const voteEl = cards[index].querySelector('.podium-votes');
                        if (voteEl) voteEl.textContent = `${dish.votes} 票`;
                    }
                });
            }
        }

        function renderDishes() {
            const grid = document.getElementById('dish-grid');
            grid.innerHTML = '';
            const isMaxed = totalVoted >= 3;
            dishesData.forEach(dish => {
                const dishId = String(dish.id);
                const voteCount = allVotes[dishId] || 0;
                const myVoteCount = userVotes[dishId] || 0;
                let dishDate = dish.date || '未知日期';
                if (dish.date && dish.date.includes('-')) {
                    const parts = dish.date.split('-');
                    if (parts.length >= 3) dishDate = `${parts[1]}月${parts[2]}日`;
                }
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title">${dish.name || '未命名'}</div>
                    <div class="card-chef">👨‍🍳 ${getChefName(dish)}</div>
                    <div class="card-date">📅 ${dishDate}</div>
                    <div class="my-vote" id="my-vote-${dishId}">我的投票：${myVoteCount} 票</div>
                    <div class="vote-count" id="count-${dishId}">总票数：<strong>${voteCount}</strong></div>
                    <div class="btn-group">
                        <button class="vote-btn" id="add-btn-${dishId}" ${isMaxed ? 'disabled' : ''} onclick="handleVote('${dishId}', 'add')">投一票</button>
                        <button class="unvote-btn" id="remove-btn-${dishId}" ${myVoteCount <= 0 ? 'disabled' : ''} onclick="handleVote('${dishId}', 'remove')">取消一票</button>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function updateUIAfterVote() {
            const isMaxed = totalVoted >= 3;
            dishesData.forEach(dish => {
                const dishId = String(dish.id);
                const myVoteCount = userVotes[dishId] || 0;
                const countEl = document.getElementById(`count-${dishId}`);
                const myVoteEl = document.getElementById(`my-vote-${dishId}`);
                const addBtn = document.getElementById(`add-btn-${dishId}`);
                const removeBtn = document.getElementById(`remove-btn-${dishId}`);
                
                if (countEl) countEl.innerHTML = `总票数：<strong>${allVotes[dishId] || 0}</strong>`;
                if (myVoteEl) myVoteEl.innerHTML = `我的投票：${myVoteCount} 票`;
                if (addBtn) addBtn.disabled = isMaxed;
                if (removeBtn) removeBtn.disabled = myVoteCount <= 0;
            });
            document.getElementById('user-info').textContent = currentUser ? `当前用户：${currentUser.name} (已投 ${totalVoted}/3 票)` : '';
            updatePodium(); 
        }

        async function handleVote(dishId, action) {
            if (!currentUser) {
                showRegisterModal();
                return;
            }

            if (action === 'add' && totalVoted >= 3) {
                alert("您最多只能投 3 票，请先取消其他菜的投票！");
                return;
            }
            if (action === 'remove' && (userVotes[dishId] || 0) <= 0) {
                alert("您还没有给这道菜投过票哦！");
                return;
            }

            // 乐观更新
            if (action === 'add') {
                userVotes[dishId] = (userVotes[dishId] || 0) + 1;
                allVotes[dishId] = (allVotes[dishId] || 0) + 1;
                totalVoted++;
            } else {
                userVotes[dishId] = (userVotes[dishId] || 0) - 1;
                if (userVotes[dishId] <= 0) delete userVotes[dishId];
                allVotes[dishId] = Math.max(0, (allVotes[dishId] || 0) - 1);
                totalVoted--;
            }
            updateUIAfterVote();

            try {
                const response = await fetch(`${API_BASE_URL}/api/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dish_id: dishId, action: action, phone: currentUser.phone })
                });
                const result = await response.json();
                if (!result.success) throw new Error(result.error);
                // 用后端返回的权威数据同步
                allVotes[dishId] = result.count;
                userVotes = result.myVotes;
                totalVoted = result.totalVoted;
                updateUIAfterVote();
            } catch (error) {
                console.error('投票失败，正在回滚:', error);
                alert('投票失败：' + error.message);
                // 重新拉取数据
                fetchUserVotes().then(() => updateUIAfterVote());
            }
        }

        window.onload = init;
    </script>
</body>
</html>
