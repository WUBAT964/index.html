<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月度好菜投票系统</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        
        .podium-section { background: white; border-radius: 16px; padding: 15px; margin-bottom: 30px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .podium-title { text-align: center; color: #ff9800; font-size: 1.3em; font-weight: bold; margin-bottom: 15px; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .podium-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .podium-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.15); position: relative; border: 3px solid transparent; animation: fadeInUp 0.6s ease-out; }
        .podium-card.rank-1 { border-color: #FFD700; }
        .podium-card.rank-2 { border-color: #C0C0C0; }
        .podium-card.rank-3 { border-color: #CD7F32; }
        .podium-badge { position: absolute; top: 8px; left: 8px; padding: 4px 10px; border-radius: 15px; font-weight: bold; color: #333; z-index: 10; font-size: 0.8em; }
        .podium-badge.rank-1 { background: #FFD700; }
        .podium-badge.rank-2 { background: #C0C0C0; }
        .podium-badge.rank-3 { background: #CD7F32; color: white; }
        .podium-card img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
        .podium-content { padding: 10px; text-align: center; }
        .podium-chef-name { font-size: 1.2em; font-weight: bold; color: #d9534f; margin-bottom: 3px; }
        .podium-dish-name { font-size: 0.8em; color: #666; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .podium-votes { font-size: 1.1em; color: #ff9800; font-weight: bold; }

        .vote-section-title { text-align: center; color: #333; font-size: 1.2em; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .card-content { padding: 15px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.1em; font-weight: bold; color: #333; margin-bottom: 5px; }
        .card-chef { font-size: 0.85em; color: #007bff; margin-bottom: 5px; font-weight: bold; }
        .card-date { font-size: 0.75em; color: #888; margin-bottom: 5px; }
        .my-vote { font-size: 0.85em; color: #28a745; margin-bottom: 5px; font-weight: bold; }
        .vote-count { color: #666; margin-bottom: 10px; font-size: 1em; }
        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        .vote-btn { flex: 1; background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: background 0.2s; }
        .vote-btn:hover { background-color: #0056b3; }
        .vote-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .unvote-btn { flex: 1; background-color: #6c757d; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: background 0.2s; }
        .unvote-btn:hover { background-color: #5a6268; }
        .unvote-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        @media (max-width: 768px) {
            body { padding: 8px; }
            h1 { font-size: 1.3em; }
            
            .podium-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 5px !important; }
            .podium-card img { height: 70px !important; }
            .podium-badge { font-size: 0.5em !important; padding: 2px 5px !important; top: 3px; left: 3px; }
            .podium-chef-name { font-size: 0.65em !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .podium-dish-name { display: none !important; }
            .podium-votes { font-size: 0.65em !important; }

            .grid { grid-template-columns: repeat(3, 1fr) !important; gap: 5px !important; }
            .card img { height: 70px !important; }
            .card-content { padding: 4px 2px !important; }
            .card-title { font-size: 0.7em !important; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .card-chef { font-size: 0.55em !important; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .card-date { font-size: 0.5em !important; margin-bottom: 2px; }
            .my-vote { font-size: 0.5em !important; margin-bottom: 2px; }
            .vote-count { font-size: 0.6em !important; margin-bottom: 3px; }
            
            .btn-group { flex-direction: column; gap: 4px; }
            .vote-btn, .unvote-btn { padding: 8px 0 !important; font-size: 0.65em !important; border-radius: 5px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ 月度好菜投票</h1>
        <div class="podium-section" id="podium-section" style="display: none;">
            <div class="podium-title">🏆 票数最高的前三名 🏆</div>
            <div class="podium-grid" id="podium-grid"></div>
        </div>
        <div class="vote-section-title">🗳️ 全部菜品投票（每人限3票）</div>
        <div class="grid" id="dish-grid"></div>
    </div>

    <script>
        const API_BASE_URL = 'https://hurricane-lightbox-funky-kitchen.trycloudflare.com'; 
        let allVotes = {};
        let dishesData = [];
        const MAX_VOTES = 3;
        let userVotes = JSON.parse(localStorage.getItem('userVotes')) || {};
        let isVoting = false;

        const PLACEHOLDER_IMG = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22100%25%22%20height%3D%22100%25%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20250%20200%22%3E%3Crect%20width%3D%22250%22%20height%3D%22200%22%20fill%3D%22%23eee%22%2F%3E%3Ctext%20x%3D%22125%22%20y%3D%22100%22%20font-family%3D%22Arial%22%20font-size%3D%2216%22%20fill%3D%22%23999%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%3E暂无图片%3C%2Ftext%3E%3C%2Fsvg%3E';

        function getImageUrl(imgField) {
            if (!imgField || imgField.trim() === '') return null;
            let finalPath = imgField.trim();
            if (!finalPath.startsWith('http') && !finalPath.includes('images/')) finalPath = 'images/' + finalPath;
            return finalPath.startsWith('http') ? finalPath : `${API_BASE_URL}/${finalPath}`;
        }

        function getChefName(dish) {
            if (dish.chef1 && dish.chef2) return `${dish.chef1} & ${dish.chef2}`;
            if (dish.chef1) return dish.chef1;
            if (dish.chef2) return dish.chef2;
            return '未知厨师';
        }

        async function init() {
            try {
                const [dishesRes, votesRes] = await Promise.all([
                    fetch(`${API_BASE_URL}/api/dishes`), 
                    fetch(`${API_BASE_URL}/api/votes`)
                ]);
                dishesData = await dishesRes.json();
                allVotes = await votesRes.json();
                dishesData.sort((a, b) => (new Date(a.date || 0) - new Date(b.date || 0)));
                
                updatePodium(); // 绝对正确的调用
                renderDishes();
                setInterval(autoRefreshVotes, 15000);
            } catch (error) {
                console.error('初始化失败:', error);
                document.getElementById('dish-grid').innerHTML = '<p style="text-align:center;color:red;">数据加载失败，请刷新重试</p>';
            }
        }

        async function autoRefreshVotes() {
            if (document.hidden || isVoting) return;
            try {
                const votesRes = await fetch(`${API_BASE_URL}/api/votes`);
                const newVotes = await votesRes.json();
                let changed = false;
                for (const [id, count] of Object.entries(newVotes)) {
                    if (allVotes[id] !== count) { allVotes[id] = count; changed = true; }
                }
                if (changed) {
                    console.log('自动刷新：票数变化');
                    dishesData.forEach(dish => {
                        const dishId = String(dish.id);
                        const countEl = document.getElementById(`count-${dishId}`);
                        if (countEl) countEl.innerHTML = `总票数：<strong>${allVotes[dishId] || 0}</strong>`;
                    });
                    updatePodium();
                }
            } catch (e) { console.error('自动刷新失败:', e); }
        }

        function getUsedVotes() {
            return Object.values(userVotes).reduce((sum, count) => sum + count, 0);
        }

        function updatePodium() {
            const sortedByVotes = [...dishesData].map(d => ({ ...d, votes: allVotes[String(d.id)] || 0 })).filter(d => d.votes > 0).sort((a, b) => b.votes - a.votes);
            const topThree = sortedByVotes.slice(0, 3);
            const podiumSection = document.getElementById('podium-section');
            const podiumGrid = document.getElementById('podium-grid');
            
            if (topThree.length === 0) { podiumSection.style.display = 'none'; return; }
            podiumSection.style.display = 'block';

            const newSignature = topThree.map(d => `${d.id}-${d.votes}`).join(',');
            if (podiumGrid.dataset.signature !== newSignature) {
                podiumGrid.dataset.signature = newSignature;
                podiumGrid.innerHTML = '';
                topThree.forEach((dish, index) => {
                    const rank = index + 1;
                    const badgeText = rank === 1 ? '🥇 第一' : rank === 2 ? '🥈 第二' : '🥉 第三';
                    const imageUrl = getImageUrl(dish.img) || PLACEHOLDER_IMG;
                    const card = document.createElement('div');
                    card.className = `podium-card rank-${rank}`;
                    card.innerHTML = `
                        <div class="podium-badge rank-${rank}">${badgeText}</div>
                        <img src="${encodeURI(imageUrl)}" alt="${dish.name}" onerror="this.src='${PLACEHOLDER_IMG}'">
                        <div class="podium-content">
                            <div class="podium-chef-name">👨‍🍳 ${getChefName(dish)}</div>
                            <div class="podium-dish-name">${dish.name || '未命名'}</div>
                            <div class="podium-votes">${dish.votes} 票</div>
                        </div>`;
                    podiumGrid.appendChild(card);
                });
            } else {
                const cards = podiumGrid.querySelectorAll('.podium-card');
                topThree.forEach((dish, index) => {
                    if (cards[index]) {
                        const voteEl = cards[index].querySelector('.podium-votes');
                        if (voteEl) voteEl.textContent = `${dish.votes} 票`;
                    }
                });
            }
        }

        function renderDishes() {
            const grid = document.getElementById('dish-grid');
            grid.innerHTML = '';
            const isMaxed = getUsedVotes() >= MAX_VOTES;
            dishesData.forEach(dish => {
                const dishId = String(dish.id);
                const voteCount = allVotes[dishId] || 0;
                const myVoteCount = userVotes[dishId] || 0;
                let dishDate = dish.date || '未知日期';
                if (dish.date && dish.date.includes('-')) {
                    const parts = dish.date.split('-');
                    if (parts.length >= 3) dishDate = `${parts[1]}月${parts[2]}日`;
                }
                const imageUrl = getImageUrl(dish.img) || PLACEHOLDER_IMG;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${encodeURI(imageUrl)}" alt="${dish.name}" loading="lazy" decoding="async" onerror="this.src='${PLACEHOLDER_IMG}'">
                    <div class="card-content">
                        <div class="card-title">${dish.name || '未命名'}</div>
                        <div class="card-chef">👨‍🍳 ${getChefName(dish)}</div>
                        <div class="card-date">📅 ${dishDate}</div>
                        <div class="my-vote" id="my-vote-${dishId}">我的投票：${myVoteCount} 票</div>
                        <div class="vote-count" id="count-${dishId}">总票数：<strong>${voteCount}</strong></div>
                        <div class="btn-group">
                            <button class="vote-btn" id="add-btn-${dishId}" ${isMaxed ? 'disabled' : ''} onclick="handleVote('${dishId}', 'add')">投一票</button>
                            <button class="unvote-btn" id="remove-btn-${dishId}" ${myVoteCount <= 0 ? 'disabled' : ''} onclick="handleVote('${dishId}', 'remove')">取消一票</button>
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function updateUIAfterVote(dishId) {
            const voteCount = allVotes[dishId] || 0;
            const myVoteCount = userVotes[dishId] || 0;
            const countEl = document.getElementById(`count-${dishId}`);
            const myVoteEl = document.getElementById(`my-vote-${dishId}`);
            if (countEl) countEl.innerHTML = `总票数：<strong>${voteCount}</strong>`;
            if (myVoteEl) myVoteEl.innerHTML = `我的投票：${myVoteCount} 票`;
            
            const isMaxed = getUsedVotes() >= MAX_VOTES;
            document.querySelectorAll('.vote-btn').forEach(btn => btn.disabled = isMaxed);
            document.querySelectorAll('.unvote-btn').forEach(btn => {
                const dId = btn.id.replace('remove-btn-', '');
                btn.disabled = (userVotes[dId] || 0) <= 0;
            });
            updatePodium(); 
        }

        async function handleVote(dishId, action) {
            if (isVoting) return;
            isVoting = true;
            const usedVotes = getUsedVotes();
            if (action === 'add' && usedVotes >= MAX_VOTES) { alert(`您最多只能投 ${MAX_VOTES} 票，请先取消其他菜的投票！`); isVoting = false; return; }
            if (action === 'remove' && (userVotes[dishId] || 0) <= 0) { alert('您还没有给这道菜投过票哦！'); isVoting = false; return; }

            const oldVotes = { ...allVotes };
            const oldUserVotes = { ...userVotes };

            if (action === 'add') {
                userVotes[dishId] = (userVotes[dishId] || 0) + 1;
                allVotes[dishId] = (allVotes[dishId] || 0) + 1;
            } else {
                userVotes[dishId] = (userVotes[dishId] || 0) - 1;
                if (userVotes[dishId] <= 0) delete userVotes[dishId];
                allVotes[dishId] = Math.max(0, (allVotes[dishId] || 0) - 1);
            }
            localStorage.setItem('userVotes', JSON.stringify(userVotes));
            updateUIAfterVote(dishId);

            try {
                const response = await fetch(`${API_BASE_URL}/api/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dish_id: dishId, action: action })
                });
                const result = await response.json();
                if (!result.success) throw new Error(result.error);
                allVotes[dishId] = result.count;
                updateUIAfterVote(dishId);
            } catch (error) {
                console.error('投票失败，正在回滚:', error);
                alert('投票失败，请检查网络重试！');
                allVotes = oldVotes;
                userVotes = oldUserVotes;
                localStorage.setItem('userVotes', JSON.stringify(userVotes));
                updateUIAfterVote(dishId);
            } finally {
                isVoting = false;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
