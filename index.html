<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月度好菜</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin: 0;
        }
        header p {
            color: var(--text-sub);
            font-size: 0.9rem;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
        .card-img-placeholder {
            width: 100%;
            height: 200px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bbb;
            font-size: 3rem;
        }
        .card-content {
            padding: 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }
        .card-info {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
        }
        .card-info span {
            margin-right: 5px;
        }
        .card-date {
            margin-top: auto;
            font-size: 0.85rem;
            color: #999;
            text-align: right;
            padding-top: 10px;
        }
        .loading, .error {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-sub);
            font-size: 1.1rem;
        }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <header>
        <h1>🍲 月度好菜</h1>
        <p>数据由 GitHub Actions 自动更新</p>
    </header>

    <main id="app" class="grid-container">
        <div class="loading">正在加载菜品数据...</div>
    </main>

    <script>
        async function loadDishes() {
            const container = document.getElementById('app');
            
            try {
                // 加上 ?v=时间戳 来强制绕过浏览器和 CDN 缓存
                const response = await fetch('dishes.json?v=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const dishes = await response.json();
                
                // 如果数组为空
                if (!dishes || dishes.length === 0) {
                    container.innerHTML = '<div class="loading">暂时还没有菜品数据哦~</div>';
                    return;
                }

                // 清空加载提示
                container.innerHTML = '';

                // 遍历数据生成卡片
                dishes.forEach(dish => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    // 处理图片
                    let imgHtml = '';
                    if (dish.img && dish.img.trim() !== '') {
                        // 核心修复：加入 referrerpolicy="no-referrer" 突破防盗链
                        imgHtml = `<img src="${dish.img}" alt="${dish.name}" class="card-img" referrerpolicy="no-referrer" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`;
                        imgHtml += `<div class="card-img-placeholder" style="display:none;">🍽️</div>`;
                    } else {
                        imgHtml = `<div class="card-img-placeholder">🍽️</div>`;
                    }

                    // 处理厨师信息
                    let chefText = dish.chef1 || '未知';
                    if (dish.chef2 && dish.chef2.trim() !== '') {
                        chefText += ` & ${dish.chef2}`;
                    }

                    card.innerHTML = `
                        ${imgHtml}
                        <div class="card-content">
                            <h2 class="card-title">${dish.name}</h2>
                            <div class="card-info"><span>👨‍🍳</span> ${chefText}</div>
                            <div class="card-date">📅 ${dish.date || '未知日期'}</div>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error('加载 dishes.json 失败:', error);
                container.innerHTML = `<div class="error">❌ 数据加载失败，请刷新页面或稍后再试。<br><small>${error.message}</small></div>`;
            }
        }

        // 页面加载时执行
        loadDishes();
    </script>
</body>
</html>
