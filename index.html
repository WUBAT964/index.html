<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月度好菜投票系统</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); }
        .card img { 
            width: 100%; height: 200px; object-fit: cover; 
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .card-content { padding: 15px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.2em; font-weight: bold; color: #333; margin-bottom: 10px; }
        .vote-count { color: #666; margin-bottom: 15px; font-size: 1.1em; }
        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        .vote-btn { flex: 1; background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: background 0.2s; }
        .vote-btn:hover { background-color: #0056b3; }
        .unvote-btn { flex: 1; background-color: #6c757d; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: background 0.2s; }
        .unvote-btn:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ 月度好菜投票</h1>
        <div class="grid" id="dish-grid"></div>
    </div>

    <script>
        // ⚠️ 必须是你最新的 Cloudflare 隧道地址 ⚠️
        const API_BASE_URL = 'https://professor-foto-ben-thorough.trycloudflare.com'; 
        const BASE_URL = 'https://wubat964.github.io/index.html'; 
        const IMG_BASE_URL = API_BASE_URL; // 图片走服务器隧道加速

        let allVotes = {};

        // 图片加载错误处理（智能回退）
        window.handleImgError = function(img, originalUrl, fallback) {
            img.onerror = null; // 防止死循环
            if (img.src.includes('.webp')) {
                // 如果webp加载失败，尝试加载原图
                img.src = originalUrl;
            } else {
                // 原图也失败了，显示"暂无图片"
                img.src = fallback;
                img.style.animation = 'none';
            }
        };

        async function init() {
            try {
                const [dishesRes, votesRes] = await Promise.all([
                    fetch(`${BASE_URL}/dishes.json`), 
                    fetch(`${API_BASE_URL}/api/votes`)
                ]);
                const dishes = await dishesRes.json();
                allVotes = await votesRes.json();
                renderDishes(dishes);
            } catch (error) {
                console.error('初始化失败:', error);
                document.getElementById('dish-grid').innerHTML = '<p style="text-align:center;color:red;">数据加载失败，请刷新重试</p>';
            }
        }

        function renderDishes(dishes) {
            const grid = document.getElementById('dish-grid');
            grid.innerHTML = '';
            if (!Array.isArray(dishes)) return;

            const fallbackImg = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22250%22%20height%3D%22200%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23eee%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20font-family%3D%22Arial%22%20font-size%3D%2214%22%20fill%3D%22%23999%22%20text-anchor%3D%22middle%22%20dy%3D%22.3em%22%3E暂无图片%3C%2Ftext%3E%3C%2Fsvg%3E';

            dishes.forEach(dish => {
                const dishId = String(dish.id);
                const voteCount = allVotes[dishId] || 0;
                
                let rawImg = dish.image || dish.img || dish.pic || dish.图片 || '';
                let originalUrl = '';
                let webpUrl = '';

                if (rawImg && typeof rawImg === 'string') {
                    if (!rawImg.includes('images/') && !rawImg.startsWith('http')) {
                        rawImg = 'images/' + rawImg; 
                    }
                    originalUrl = rawImg.startsWith('http') ? rawImg : `${IMG_BASE_URL}/${rawImg}`;
                    // 尝试将后缀替换为 webp
                    webpUrl = originalUrl.replace(/\.(jpg|jpeg|png)$/i, '.webp');
                } else {
                    originalUrl = fallbackImg;
                    webpUrl = fallbackImg;
                }

                const card = document.createElement('div');
                card.className = 'card';
                // 优先加载 webp 格式，如果失败自动回退到原图
                card.innerHTML = `
                    <img src="${encodeURI(webpUrl)}" alt="${dish.name}" loading="lazy" decoding="async"
                         onload="this.style.animation='none'; this.style.background='#eee';" 
                         onerror="handleImgError(this, '${encodeURI(originalUrl)}', '${fallbackImg}')">
                    <div class="card-content">
                        <div class="card-title">${dish.name || '未命名'}</div>
                        <div class="vote-count" id="count-${dishId}">当前票数：<strong>${voteCount}</strong></div>
                        <div class="btn-group">
                            <button class="vote-btn" onclick="handleVote('${dishId}', 'add')">投一票</button>
                            <button class="unvote-btn" onclick="handleVote('${dishId}', 'remove')">取消一票</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function handleVote(dishId, action) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dish_id: dishId, action: action })
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById(`count-${dishId}`).innerHTML = `当前票数：<strong>${result.count}</strong>`;
                } else {
                    alert('操作失败：' + result.error);
                }
            } catch (error) {
                alert('网络请求失败，请刷新重试');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
