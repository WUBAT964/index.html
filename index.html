<script>
    // ==================== 替换为你自己的云函数 HTTP 网关地址 ====================
    const FUNC_URL = 'https://monthly-dishes-d7gu69s4x8964e12e-1499564379.ap-shanghai.app.tcloudbase.com/vote-api';

    function isRealImage(url) {
        if (!url) return false;
        return /\.(jpeg|jpg|gif|png|webp|bmp|svg)($|\?)/i.test(url) || url.startsWith('images/');
    }

    function getLocalVotedIds() {
        const voted = localStorage.getItem('voted_dish_ids');
        return voted ? JSON.parse(voted) : [];
    }
    function saveLocalVotedIds(ids) {
        localStorage.setItem('voted_dish_ids', JSON.stringify(ids));
    }

    // 封装 JSONP 请求（绕过 CORS）
    function jsonp(url) {
        return new Promise((resolve, reject) => {
            const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
            window[callbackName] = (data) => {
                resolve(data);
                document.body.removeChild(script);
                delete window[callbackName];
            };
            const script = document.createElement('script');
            script.src = `${url}&callback=${callbackName}`; // 追加 callback 参数
            script.onerror = () => {
                reject(new Error('JSONP request failed'));
                document.body.removeChild(script);
                delete window[callbackName];
            };
            document.body.appendChild(script);
        });
    }

    async function loadDishes() {
        const container = document.getElementById('app');
        const votedIds = getLocalVotedIds();

        try {
            const response = await fetch('dishes.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const dishes = await response.json();

            if (!dishes || dishes.length === 0) {
                container.innerHTML = '<div class="loading">暂时还没有菜品数据哦~</div>';
                return;
            }

            // 改用 JSONP 获取云端票数
            let voteCounts = {};
            try {
                const voteData = await jsonp(`${FUNC_URL}/api/votes?t=${new Date().getTime()}`);
                voteData.forEach(v => { voteCounts[v.dishId] = v.count || 0; });
            } catch (e) {
                console.warn('获取云端票数失败，将从 0 开始', e);
            }

            container.innerHTML = '';

            dishes.forEach(dish => {
                let imgHtml = '';
                const imgUrl = dish.img ? dish.img.trim() : '';
                if (!imgUrl) {
                    imgHtml = `<div class="card-image-wrapper"><div class="image-placeholder"><div class="icon">🍽️</div><span class="text">暂无图片</span></div></div>`;
                } else if (isRealImage(imgUrl)) {
                    imgHtml = `<div class="card-image-wrapper"><img src="${imgUrl}" alt="${dish.name}" class="card-img" referrerpolicy="no-referrer" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'image-placeholder\'><div class=\'icon\'>🥘</div><span class=\'text\'>加载失败</span></div>'"></div>`;
                } else {
                    imgHtml = `<div class="card-image-wrapper"><div class="image-placeholder" onclick="window.open('${imgUrl}', '_blank')"><div class="icon">🌿</div><span class="text">点击查看原图</span></div></div>`;
                }

                let chefText = dish.chef1 || '未知厨师';
                if (dish.chef2 && dish.chef2.trim() !== '') chefText += ` & ${dish.chef2}`;

                const hasVoted = votedIds.includes(dish.id);
                const voteCount = voteCounts[dish.id] || 0;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${imgHtml}
                    <div class="card-content">
                        <h2 class="card-title" title="${dish.name}">${dish.name}</h2>
                        <div class="card-info">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                            ${chefText}
                        </div>
                        <div class="card-date">📅 ${dish.date || '未知日期'}</div>
                        <div class="vote-area">
                            <button class="vote-btn ${hasVoted ? 'voted' : ''}" onclick="toggleVote(this, ${dish.id})">
                                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                <span class="vote-text">${hasVoted ? '已投票' : '投一票'}</span>
                                <span class="vote-count">${voteCount > 0 ? voteCount : ''}</span>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (error) {
            console.error('加载失败:', error);
            container.innerHTML = `<div class="error">❌ 数据加载失败，请刷新页面。<br><small>${error.message}</small></div>`;
        }
    }

    async function toggleVote(btn, dishId) {
        const votedIds = getLocalVotedIds();
        const voteCountSpan = btn.querySelector('.vote-count');
        const voteTextSpan = btn.querySelector('.vote-text');

        if (btn.disabled) return;
        btn.disabled = true;

        if (votedIds.includes(dishId)) {
            alert('您今天已经投过这道菜啦！');
            btn.disabled = false;
            return;
        }

        try {
            // 改用 JSONP 提交投票
            const data = await jsonp(`${FUNC_URL}/api/vote?dishId=${dishId}&t=${new Date().getTime()}`);

            votedIds.push(dishId);
            saveLocalVotedIds(votedIds);

            btn.classList.add('voted');
            voteTextSpan.textContent = '已投票';
            voteCountSpan.textContent = data.count;

            btn.style.transform = 'scale(1.1)';
            setTimeout(() => { btn.style.transform = 'scale(1)'; }, 200);

        } catch (e) {
            console.error('投票失败:', e);
            alert('网络错误，请重试');
        } finally {
            btn.disabled = false;
        }
    }

    loadDishes();
</script>
