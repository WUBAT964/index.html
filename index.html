<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月度好菜投票</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 14px; font-size: 16px; }
h1 { text-align: center; color: #333; font-size: 1.8em; margin: 12px 0; }

/* ⏰ 倒计时条 */
.countdown {
  text-align: center; font-weight: bold; color: #fff;
  background: linear-gradient(90deg, #ff5252, #ff9800);
  padding: 12px; border-radius: 8px; margin: 0 auto 12px;
  max-width: 480px; font-size: 1.05em;
  box-shadow: 0 2px 10px rgba(255,82,82,.35);
  letter-spacing: .5px;
  transition: background .5s ease, box-shadow .5s ease;
}
.countdown.ended { background: linear-gradient(90deg, #999, #777); box-shadow: none; font-size: 1em; }
.countdown.free  { background: linear-gradient(90deg, #4caf50, #8bc34a); box-shadow: 0 2px 10px rgba(76,175,80,.35); }
.countdown .num {
  display: inline-block; min-width: 2.2em; padding: 2px 6px; margin: 0 2px;
  background: rgba(0,0,0,.18); border-radius: 4px;
  font-variant-numeric: tabular-nums;
  font-family: "SF Mono", Menlo, Consolas, monospace;
}

/* ============ 📅 圆角自定义下拉菜单 ============ */
.month-picker {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  max-width: 480px;
  margin: 0 auto 12px;
  position: relative;
  z-index: 200;
}
.month-picker label {
  color: #555;
  font-weight: 600;
  font-size: .95em;
  flex-shrink: 0;
}

.dropdown {
  position: relative;
  flex: 1;
  max-width: 260px;
  min-width: 170px;
}

.dropdown-trigger {
  /* 覆盖全局 button 的 flex:1 */
  flex: none !important;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  padding: 10px 20px;
  font-size: .95em;
  font-weight: 600;
  font-family: inherit;
  color: #333;

  background: #fff;
  border: 1.5px solid #e5e7eb;
  border-radius: 999px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  cursor: pointer;
  text-align: left;

  transition: border-color .25s ease, box-shadow .25s ease, background-color .25s ease;
}
.dropdown-trigger:hover {
  border-color: #c7d2fe;
  background: #fafaff;
  box-shadow: 0 4px 12px rgba(99,102,241,.12);
}
.dropdown-trigger:active {
  transform: none;
}
.dropdown.open .dropdown-trigger {
  border-color: #6366f1;
  box-shadow: 0 0 0 4px rgba(99,102,241,.15);
}

.dropdown-arrow {
  transition: transform .3s cubic-bezier(.22,.61,.36,1);
  flex-shrink: 0;
}
.dropdown.open .dropdown-arrow {
  transform: rotate(180deg);
}

/* 弹出面板 */
.dropdown-panel {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.15), 0 2px 8px rgba(0,0,0,.08);
  padding: 6px;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transform: translateY(-8px) scale(0.96);
  transform-origin: top center;
  pointer-events: none;
  transition:
    opacity .22s ease,
    transform .28s cubic-bezier(.22,.61,.36,1),
    max-height .3s cubic-bezier(.22,.61,.36,1);
  z-index: 1000;
}
.dropdown.open .dropdown-panel {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
  max-height: 320px;
  overflow-y: auto;
}

.dropdown-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: .92em;
  font-weight: 500;
  color: #333;
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
  user-select: none;
}
.dropdown-item:hover {
  background: #eef2ff;
  color: #4f46e5;
}
.dropdown-item.active {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: #fff;
  font-weight: 600;
}
.dropdown-item.ended {
  opacity: .55;
}
.dropdown-item .status-dot {
  font-size: .75em;
}

/* ============ 提示条 ============ */
.month-tip {
  text-align: center; font-weight: bold; color: #fff; background: #ff9800;
  padding: 10px; border-radius: 8px; margin: 0 auto 18px; max-width: 480px; font-size: 1em;
}
.user-info {
  text-align: center; color: #28a745; font-weight: bold; margin-bottom: 14px; font-size: 1em;
}

/* ============ 📦 菜品网格 ============ */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  max-width: 1300px;
  margin: 0 auto;
  opacity: 1;
  transform: translateY(0);
  transition: opacity .25s ease, transform .25s ease;
}
.grid.fading-out {
  opacity: 0;
  transform: translateY(10px);
}

.card {
  background: #fff; border-radius: 10px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  display: flex; flex-direction: column;
  transition: transform .25s ease, box-shadow .25s ease;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 20px rgba(0,0,0,.15);
}
.grid.animate .card {
  animation: cardIn .45s cubic-bezier(.22,.61,.36,1) both;
}

.card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #eee; cursor: pointer; transition: transform .4s ease; }
.card img:hover { transform: scale(1.03); }
.no-img { width: 100%; height: 220px; background: #eee; display: flex; align-items: center; justify-content: center; color: #999; font-size: 1em; }

.info { padding: 12px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
.name { font-weight: bold; color: #333; font-size: 1.15em; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chef { color: #007bff; margin: 4px 0; font-size: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date { color: #888; font-size: .95em; }
.votes {
  color: #ff9800; font-weight: bold; font-size: 1.15em; margin: 6px 0;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), color .3s ease;
}
.votes.bump {
  transform: scale(1.25);
  color: #ff5722;
}
.btns { display: flex; gap: 6px; margin-top: 8px; }
button {
  flex: 1; padding: 11px 2px; border: none; border-radius: 6px; color: #fff;
  font-size: 1em; cursor: pointer; font-family: inherit; -webkit-appearance: none;
  transition: background .2s ease, transform .1s ease, opacity .2s ease;
}
button:not(:disabled):hover { filter: brightness(1.1); }
button:not(:disabled):active { transform: scale(0.96); }
.add { background: #007bff; }
.remove { background: #6c757d; }
button:disabled { background: #ccc; cursor: not-allowed; opacity: .7; }

/* ============ 🏆 领奖台 ============ */
.podium {
  background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  transition: opacity .25s ease, transform .25s ease;
}
.podium.fading-out { opacity: 0; transform: translateY(10px); }
.podium-title { text-align: center; color: #ff9800; font-weight: bold; margin-bottom: 14px; font-size: 1.3em; }
.podium-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.podium-card {
  border-radius: 10px; overflow: hidden; position: relative; border: 3px solid #eee; background: #fff;
  transition: box-shadow .3s ease;
}
.podium-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,.15); }
.podium-card.r1 { border-color: #FFD700; }
.podium-card.r2 { border-color: #C0C0C0; }
.podium-card.r3 { border-color: #CD7F32; }
.podium-badge {
  position: absolute; top: 8px; left: 8px; padding: 4px 10px; border-radius: 12px;
  font-size: .85em; font-weight: bold; background: #FFD700; color: #333; z-index: 2;
}
.podium-card.r2 .podium-badge { background: #C0C0C0; }
.podium-card.r3 .podium-badge { background: #CD7F32; color: #fff; }

.podium-card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #eee; }
.podium-card .no-img { width: 100%; height: 220px; }

.podium-info { padding: 12px; text-align: center; }
.podium-name { font-weight: bold; color: #333; font-size: 1.15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.podium-chef { color: #d9534f; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; font-size: 1em; }
.podium-date { color: #888; font-size: .95em; margin-top: 4px; }
.podium-votes { color: #ff9800; font-weight: bold; margin-top: 6px; font-size: 1.2em; }

/* ============ 弹窗 ============ */
.modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,.6); justify-content: center; align-items: center; opacity: 0; transition: opacity .3s ease; }
.modal.show { display: flex; opacity: 1; }
.modal-box {
  background: #fff; padding: 28px; border-radius: 12px; width: 88%; max-width: 400px; text-align: center;
  transform: scale(0.9); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
}
.modal.show .modal-box { transform: scale(1); }
.modal-box h2 { margin: 0 0 12px; color: #333; font-size: 1.4em; }
.modal-box p { color: #666; font-size: 1em; margin: 0 0 14px; }
.modal-box input {
  width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px;
  font-size: 1.05em; font-family: inherit; box-sizing: border-box; -webkit-appearance: none;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.modal-box input:focus { outline: none; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,.15); }
.modal-box button { width: 100%; padding: 13px; background: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 1.1em; margin-top: 10px; }
.err { color: #d9534f; font-size: .95em; margin-bottom: 8px; display: none; }

/* ============ 🖼️ 图片查看器（FLIP 动画） ============ */
.viewer {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,.92);
  z-index: 99999;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}
.viewer.show {
  opacity: 1;
  pointer-events: auto;
}
.viewer img {
  width: auto;
  height: auto;
  max-width: 92vw;
  max-height: 88vh;
  display: block;
  will-change: transform, opacity;
  border-radius: 4px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.viewer-close {
  position: absolute; top: 15px; right: 20px;
  color: #fff; font-size: 32px; font-weight: bold;
  cursor: pointer; padding: 4px 12px; line-height: 1;
  background: rgba(255,255,255,.12); border-radius: 50%;
  transition: background .2s ease, transform .25s ease;
  z-index: 100000;
}
.viewer-close:hover {
  background: rgba(255,255,255,.28);
  transform: rotate(90deg);
}

/* 动画关键帧 */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 768px) {
  body { padding: 8px; font-size: 15px; }
  h1 { font-size: 1.5em; }
  .countdown { font-size: .9em; padding: 9px; margin-bottom: 10px; }
  .countdown .num { min-width: 1.8em; padding: 1px 4px; }
  .month-picker { margin-bottom: 10px; gap: 8px; }
  .month-picker label { font-size: .85em; }
  .dropdown-trigger { padding: 8px 14px; font-size: .9em; }
  .dropdown-item { padding: 9px 12px; font-size: .88em; }
  .month-tip { font-size: .9em; padding: 8px; margin-bottom: 12px; }
  .user-info { font-size: .95em; }
  .grid { gap: 6px; }
  .card img, .no-img { height: 110px; }
  .info { padding: 7px; }
  .name { font-size: 1em; margin-bottom: 3px; }
  .chef { font-size: .85em; margin: 3px 0; }
  .date { font-size: .8em; }
  .votes { font-size: 1em; margin: 4px 0; }
  button { padding: 8px 2px; font-size: .85em; }
  .btns { gap: 4px; margin-top: 5px; }
  .podium { padding: 10px; margin-bottom: 12px; }
  .podium-title { font-size: 1.1em; margin-bottom: 10px; }
  .podium-grid { gap: 6px; }
  .podium-card img, .podium-card .no-img { height: 110px; }
  .podium-info { padding: 6px; }
  .podium-name { font-size: 1em; }
  .podium-chef { font-size: .85em; margin-top: 3px; }
  .podium-date { font-size: .8em; margin-top: 3px; }
  .podium-votes { font-size: 1em; margin-top: 4px; }
  .viewer-close { font-size: 28px; top: 10px; right: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<h1>🍽️ 月度好菜投票</h1>

<div class="countdown" id="countdown">⏰ 计算中...</div>

<!-- 📅 圆角自定义月份下拉 -->
<div class="month-picker">
  <label>📅 月份：</label>
  <div class="dropdown" id="month-dropdown">
    <button type="button" class="dropdown-trigger" id="month-trigger">
      <span id="month-label">加载中...</span>
      <svg class="dropdown-arrow" width="12" height="8" viewBox="0 0 12 8">
        <path fill="#9ca3af" d="M6 8L0 0h12z"/>
      </svg>
    </button>
    <div class="dropdown-panel" id="month-panel"></div>
  </div>
</div>

<div class="month-tip" id="month-tip">📅 加载中...</div>
<div class="user-info" id="user-info"></div>

<div class="podium" id="podium" style="display:none">
  <div class="podium-title">🏆 票数最高的前三名 🏆</div>
  <div class="podium-grid" id="podium-grid"></div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>身份验证</h2>
    <p>请输入手机号和姓名</p>
    <input type="tel" id="in-phone" placeholder="手机号">
    <input type="text" id="in-name" placeholder="姓名（首次注册需填写）">
    <div class="err" id="err"></div>
    <button id="btn-reg" type="button">登录 / 注册</button>
  </div>
</div>

<div class="viewer" id="viewer">
  <span class="viewer-close" id="viewer-close">✕</span>
  <img id="viewer-img" src="" alt="">
</div>

<script>
(function(){
  "use strict";

  var API = 'https://exemption-eliminate-watts-merchant.trycloudflare.com';
  var CDN = 'https://cdn.jsdelivr.net/gh/WUBAT964/images@main';

  var currentMonth = '';
  var DEADLINE = null;
  var _animNextRender = false;

  var NAME_MAP = {
    "1_炆行鸡.jpg":             "1_wenxingji.jpg",
    "2_酸汤猪脚.jpg":           "2_suantangzhujiao.jpg",
    "3_酸菜鱼.jpg":             "3_suancaiyu.jpg",
    "6_白切五花肉、膈山肉.jpg":  "6_baqiewuhuarou.jpg",
    "8_紫苏炆鸭.jpg":           "8_zisuwenya.jpg",
    "9_水煮肉片.jpg":           "9_shuizhuroupian.jpg",
    "10_蒸排骨.jpg":            "10_zhengpaigu.jpg",
    "11_肉沫豆腐.jpg":          "11_roumodoufu.jpg",
    "12_五花肉.jpg":            "12_wuhuarou.jpg",
    "13_排骨炆五彩椒.jpg":      "13_paiguwencaijiao.jpg",
    "15_五花肉.jpg":            "15_wuhuarou.jpg",
    "17_啤酒鸭.jpg":            "17_pijiua.jpg",
    "18_排骨炆芋头.jpg":        "18_paiguweiyutou.jpg",
    "20_豆腐炆鱼.jpg":          "20_doufuweiyu.jpg",
    "21_清蒸鲈鱼.jpg":          "21_qingzhengluyu.jpg"
  };

  var votes = {};
  var dishes = [];
  var allDishesCache = [];
  var monthDeadlines = {};
  var user = null;
  try { user = JSON.parse(localStorage.getItem('chef_user') || 'null'); } catch(e) { user = null; }

  function $(id){ return document.getElementById(id); }
  function getVote(dishId){ return (user && user.votes && user.votes[dishId]) ? user.votes[dishId] : 0; }
  function getTotalVoted(){
    if (!user || !user.votes) return 0;
    var t = 0;
    for (var k in user.votes) { if (user.votes.hasOwnProperty(k)) t += user.votes[k]; }
    return t;
  }
  function chefName(d){
    var a = d.chef1 || '', b = d.chef2 || '';
    if (a && b) return a + ' & ' + b;
    return a || b || '未知厨师';
  }
  function fmtDate(s){
    if (!s) return '未知';
    var p = String(s).split('-');
    if (p.length >= 3) return p[1] + '月' + p[2] + '日';
    return s;
  }
  function isVoteOpen(){
    if (DEADLINE === null) return true;
    return Date.now() < DEADLINE;
  }
  function imgUrl(f){
    if (!f) return '';
    f = String(f).trim();
    if (!f) return '';
    var name = f.split('?')[0].split('#')[0].split('/').pop();
    if (!name) return '';
    if (NAME_MAP[name]) name = NAME_MAP[name];
    return CDN + '/' + name;
  }

  // ============ ⏰ 倒计时 ============
  var lastOpenState = null;

  function pad2(n){ return n < 10 ? '0' + n : String(n); }

  function updateCountdown(){
    var el = $('countdown');
    if (!el) return;

    if (!currentMonth){
      el.className = 'countdown free';
      el.innerHTML = '📅 全部月份汇总 · 选择上方月份查看倒计时';
      if (lastOpenState !== 'all'){
        lastOpenState = 'all';
        render();
      }
      return;
    }

    if (DEADLINE === null){
      el.className = 'countdown free';
      el.innerHTML = '⏰ ' + currentMonth + ' 投票进行中（未设截止）';
      if (lastOpenState !== true){
        lastOpenState = true;
        render();
      }
      return;
    }

    var diff = DEADLINE - Date.now();

    if (diff <= 0){
      el.className = 'countdown ended';
      el.innerHTML = '⏰ ' + currentMonth + ' 投票已结束 · 感谢参与';
      if (lastOpenState !== false){
        lastOpenState = false;
        render();
      }
      return;
    }

    if (lastOpenState !== true){
      lastOpenState = true;
      if ($('grid').children.length > 0) render();
    }

    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins  = Math.floor((diff % 3600000) / 60000);
    var secs  = Math.floor((diff % 60000) / 1000);

    el.className = 'countdown';
    el.innerHTML =
      '⏰ ' + currentMonth + ' 投票还剩 ' +
      '<span class="num">' + days + '</span>天 ' +
      '<span class="num">' + pad2(hours) + '</span>:' +
      '<span class="num">' + pad2(mins) + '</span>:' +
      '<span class="num">' + pad2(secs) + '</span>';
  }

  // ============ 📅 圆角自定义下拉 ============
  var _monthList = [];

  function renderMonthSelect(months){
    _monthList = months.slice();
    var trigger = $('month-trigger');
    var dropdown = $('month-dropdown');

    if (!trigger._bound){
      trigger._bound = true;
      trigger.onclick = function(e){
        e.stopPropagation();
        dropdown.classList.toggle('open');
      };
      document.addEventListener('click', function(e){
        if (!dropdown.contains(e.target)) dropdown.classList.remove('open');
      });
      document.addEventListener('keydown', function(e){
        if (e.key === 'Escape') dropdown.classList.remove('open');
      });
    }

    rebuildPanel();
  }

  function rebuildPanel(){
    var panel = $('month-panel');
    if (!panel) return;
    panel.innerHTML = '';

    appendItem(panel, '', '全部月份（汇总）', null);

    _monthList.forEach(function(m){
      var info = monthDeadlines[m];
      var open = info ? info.open !== false : true;
      appendItem(panel, m, m, open);
    });
  }

  function appendItem(panel, value, label, open){
    var item = document.createElement('div');
    item.className = 'dropdown-item';
    if (value === currentMonth) item.classList.add('active');
    if (open === false) item.classList.add('ended');
    item.setAttribute('data-value', value);

    var text = document.createElement('span');
    text.textContent = label;
    item.appendChild(text);

    if (open !== null){
      var dot = document.createElement('span');
      dot.className = 'status-dot';
      dot.textContent = open === false ? '🔴' : '🟢';
      item.appendChild(dot);
    }

    item.onclick = function(e){
      e.stopPropagation();
      $('month-dropdown').classList.remove('open');
      if (value === currentMonth) return;
      loadMonth(value);
    };

    panel.appendChild(item);
  }

  function updateMonthSelectUI(){
    var label = $('month-label');
    if (label){
      label.textContent = currentMonth || '全部月份（汇总）';
    }
    var panel = $('month-panel');
    if (panel){
      var items = panel.querySelectorAll('.dropdown-item');
      for (var i = 0; i < items.length; i++){
        var v = items[i].getAttribute('data-value');
        items[i].classList.toggle('active', v === currentMonth);

        var info = monthDeadlines[v];
        if (v && info){
          items[i].classList.toggle('ended', info.open === false);
          var dot = items[i].querySelector('.status-dot');
          if (dot) dot.textContent = info.open === false ? '🔴' : '🟢';
        }
      }
    }
  }

  function loadMonth(month){
    var grid = $('grid');
    var podium = $('podium');

    grid.classList.add('fading-out');
    if (podium.style.display !== 'none') {
      podium.classList.add('fading-out');
    }

    var doUpdate = function(){
      currentMonth = month || '';
      var tip = $('month-tip');

      if (!currentMonth){
        dishes = allDishesCache.slice();
        tip.textContent = '📅 显示全部菜品（共 ' + dishes.length + ' 道）';
      } else {
        dishes = allDishesCache.filter(function(d){
          return (d.date || '').indexOf(currentMonth) === 0;
        });
        tip.textContent = '📅 ' + currentMonth + ' 菜品（共 ' + dishes.length + ' 道）';
      }

      updateMonthSelectUI();

      var url = API + '/api/vote_status';
      if (currentMonth) url += '?month=' + encodeURIComponent(currentMonth);

      fetch(url)
        .then(function(r){ return r.json(); })
        .then(function(s){
          if (currentMonth && s.deadline){
            var t = Date.parse(s.deadline);
            if (isNaN(t)) t = Date.parse(s.deadline.replace(/\+08:00$/, ''));
            DEADLINE = isNaN(t) ? null : t;
          } else {
            DEADLINE = null;
          }
          lastOpenState = null;
        })
        .catch(function(){
          DEADLINE = null;
          lastOpenState = null;
        })
        .then(function(){
          dishes.sort(function(a, b){ return (a.date || '').localeCompare(b.date || ''); });
          updateCountdown();

          _animNextRender = true;
          grid.classList.add('animate');
          setTimeout(function(){ grid.classList.remove('animate'); }, 900);

          loadVotes();

          requestAnimationFrame(function(){
            grid.classList.remove('fading-out');
            podium.classList.remove('fading-out');
          });
        });
    };

    setTimeout(doUpdate, 250);
  }

  // ============ 渲染 ============

  function render(){
    var g = $('grid');
    g.innerHTML = '';
    var voteOpen = isVoteOpen();
    var maxed = getTotalVoted() >= 3;
    var playAnim = _animNextRender;
    _animNextRender = false;

    var oldVotes = {};
    for (var k in votes) { oldVotes[k] = votes[k]; }

    for (var i = 0; i < dishes.length; i++){
      var d = dishes[i];
      var id = String(d.id);
      var url = imgUrl(d.img);
      var my = getVote(id);
      var total = votes[id] || 0;

      var card = document.createElement('div');
      card.className = 'card';
      if (playAnim) {
        card.style.animationDelay = (i * 0.03) + 's';
      }

      var imgEl;
      if (url){
        imgEl = document.createElement('img');
        imgEl.src = url;
        imgEl.loading = 'lazy';
        imgEl.onerror = function(){
          var ph = document.createElement('div');
          ph.className = 'no-img';
          ph.textContent = '暂无图片';
          if (this.parentNode) this.parentNode.replaceChild(ph, this);
        };
        (function(el, u){ el.onclick = function(){ openViewer(el, u); }; })(imgEl, url);
      } else {
        imgEl = document.createElement('div');
        imgEl.className = 'no-img';
        imgEl.textContent = '暂无图片';
      }
      card.appendChild(imgEl);

      var info = document.createElement('div');
      info.className = 'info';

      var nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = d.name || '';
      info.appendChild(nameEl);

      var chefEl = document.createElement('div');
      chefEl.className = 'chef';
      chefEl.textContent = '👨‍🍳 ' + chefName(d);
      info.appendChild(chefEl);

      var dateEl = document.createElement('div');
      dateEl.className = 'date';
      dateEl.textContent = '📅 ' + fmtDate(d.date);
      info.appendChild(dateEl);

      var votesEl = document.createElement('div');
      votesEl.className = 'votes';
      votesEl.id = 'v-' + id;
      votesEl.textContent = total + ' 票';
      if (oldVotes[id] !== undefined && oldVotes[id] !== total){
        votesEl.classList.add('bump');
        setTimeout((function(el){ return function(){ el.classList.remove('bump'); }; })(votesEl), 400);
      }
      info.appendChild(votesEl);

      var btns = document.createElement('div');
      btns.className = 'btns';

      var addBtn = document.createElement('button');
      addBtn.className = 'add';
      addBtn.type = 'button';
      addBtn.textContent = voteOpen ? '投一票' : '已结束';
      if (maxed || !voteOpen) addBtn.disabled = true;
      addBtn.setAttribute('data-id', id);
      addBtn.setAttribute('data-act', 'add');
      btns.appendChild(addBtn);

      var rmBtn = document.createElement('button');
      rmBtn.className = 'remove';
      rmBtn.type = 'button';
      rmBtn.textContent = '取消';
      if (my <= 0 || !voteOpen) rmBtn.disabled = true;
      rmBtn.setAttribute('data-id', id);
      rmBtn.setAttribute('data-act', 'remove');
      btns.appendChild(rmBtn);

      info.appendChild(btns);
      card.appendChild(info);
      g.appendChild(card);
    }
    renderPodium();
    $('user-info').textContent = user ? '当前用户：' + user.name + '（已投 ' + getTotalVoted() + '/3 票）' : '';
  }

  function renderPodium(){
    var arr = [];
    for (var i = 0; i < dishes.length; i++){
      var d = dishes[i];
      var v = votes[String(d.id)] || 0;
      if (v > 0) arr.push({ dish: d, votes: v });
    }
    arr.sort(function(a, b){ return b.votes - a.votes; });
    var top = arr.slice(0, 3);
    var p = $('podium'), g = $('podium-grid');
    if (top.length === 0){ p.style.display = 'none'; return; }
    p.style.display = 'block';
    g.innerHTML = '';
    for (var i = 0; i < top.length; i++){
      var it = top[i], d = it.dish, url = imgUrl(d.img);
      var rank = i + 1;
      var badge = rank === 1 ? '🥇 第一' : rank === 2 ? '🥈 第二' : '🥉 第三';
      var card = document.createElement('div');
      card.className = 'podium-card r' + rank;

      var badgeEl = document.createElement('div');
      badgeEl.className = 'podium-badge';
      badgeEl.textContent = badge;
      card.appendChild(badgeEl);

      if (url){
        var img = document.createElement('img');
        img.src = url;
        img.onerror = function(){
          var ph = document.createElement('div');
          ph.className = 'no-img';
          ph.textContent = '暂无图片';
          if (this.parentNode) this.parentNode.replaceChild(ph, this);
        };
        card.appendChild(img);
      } else {
        var ph = document.createElement('div');
        ph.className = 'no-img';
        ph.textContent = '暂无图片';
        card.appendChild(ph);
      }

      var info = document.createElement('div');
      info.className = 'podium-info';
      info.innerHTML = '<div class="podium-name">🍽️ ' + (d.name || '') + '</div>' +
                       '<div class="podium-chef">👨‍🍳 ' + chefName(d) + '</div>' +
                       '<div class="podium-date">📅 ' + fmtDate(d.date) + '</div>' +
                       '<div class="podium-votes">' + it.votes + ' 票</div>';
      card.appendChild(info);
      g.appendChild(card);
    }
  }

  function showModal(){ $('modal').className = 'modal show'; }
  function hideModal(){ $('modal').className = 'modal'; }

  function submitRegister(){
    var phone = $('in-phone').value.trim();
    var name = $('in-name').value.trim();
    var err = $('err');
    err.style.display = 'none';
    if (!phone){ err.textContent = '手机号不能为空'; err.style.display = 'block'; return; }

    var btn = $('btn-reg');
    btn.disabled = true;
    btn.textContent = '处理中...';

    fetch(API + '/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, phone: phone })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      btn.disabled = false;
      btn.textContent = '登录 / 注册';
      if (data.success){
        user = { name: data.name, phone: phone, votes: data.votedDishes || {} };
        localStorage.setItem('chef_user', JSON.stringify(user));
        hideModal();
        render();
      } else {
        err.textContent = data.error || '失败';
        err.style.display = 'block';
      }
    })
    .catch(function(){
      btn.disabled = false;
      btn.textContent = '登录 / 注册';
      err.textContent = '网络错误，请重试';
      err.style.display = 'block';
    });
  }

  function doVote(id, act, btn){
    if (!isVoteOpen()){
      alert('本次投票已结束！');
      render();
      return;
    }
    if (!user){ showModal(); return; }
    if (act === 'add' && getTotalVoted() >= 3){ alert('您最多只能投3票，请先取消其他菜的投票'); return; }

    btn.disabled = true;
    var oldText = btn.textContent;
    btn.textContent = '...';

    fetch(API + '/api/vote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dish_id: id, action: act, phone: user.phone })
    })
    .then(function(r){
      return r.json().then(function(j){ return { status: r.status, data: j }; });
    })
    .then(function(res){
      btn.disabled = false;
      btn.textContent = oldText;
      var data = res.data;
      if (data.success){
        votes[id] = data.count;
        user.votes = data.myVotes || {};
        localStorage.setItem('chef_user', JSON.stringify(user));
        render();
      } else {
        alert(data.error || '失败');
        if (res.status === 403){
          if (DEADLINE !== null) DEADLINE = Math.min(DEADLINE, Date.now() - 1);
          updateCountdown();
          render();
        }
      }
    })
    .catch(function(){
      btn.disabled = false;
      btn.textContent = oldText;
      alert('网络错误，请重试');
    });
  }

  // ============ 🖼️ 图片查看器（FLIP 动画） ============
  var viewer = $('viewer');
  var viewerImg = $('viewer-img');
  var _lastTriggerEl = null;

  function openViewer(triggerEl, url){
    _lastTriggerEl = triggerEl;

    var from = triggerEl.getBoundingClientRect();

    viewer.classList.add('show');
    viewerImg.style.opacity = '0';
    viewerImg.style.transform = '';
    viewerImg.style.transition = 'none';
    viewerImg.src = url;

    var startFly = function(){
      var to = viewerImg.getBoundingClientRect();
      if (to.width === 0 || to.height === 0){
        viewerImg.style.opacity = '1';
        return;
      }

      var cx1 = from.left + from.width / 2;
      var cy1 = from.top + from.height / 2;
      var cx2 = to.left + to.width / 2;
      var cy2 = to.top + to.height / 2;
      var dx = cx1 - cx2;
      var dy = cy1 - cy2;
      var scale = from.width / to.width;

      viewerImg.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ')';
      viewerImg.style.opacity = '0.6';

      void viewerImg.offsetWidth;

      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          viewerImg.style.transition = 'transform .45s cubic-bezier(.34,1.15,.64,1), opacity .25s ease';
          viewerImg.style.transform = 'translate(0, 0) scale(1)';
          viewerImg.style.opacity = '1';
        });
      });
    };

    if (viewerImg.complete && viewerImg.naturalWidth > 0){
      requestAnimationFrame(function(){
        requestAnimationFrame(startFly);
      });
    } else {
      viewerImg.onload = function(){
        viewerImg.onload = null;
        requestAnimationFrame(startFly);
      };
      viewerImg.onerror = function(){
        viewerImg.onerror = null;
        viewerImg.style.opacity = '1';
      };
    }
  }

  function closeViewer(){
    var trigger = _lastTriggerEl;

    if (!trigger || !viewerImg.src || !viewerImg.offsetParent){
      viewer.classList.remove('show');
      setTimeout(function(){
        viewerImg.src = '';
        viewerImg.style.transition = '';
        viewerImg.style.transform = '';
        viewerImg.style.opacity = '';
      }, 300);
      _lastTriggerEl = null;
      return;
    }

    var from = trigger.getBoundingClientRect();
    var to = viewerImg.getBoundingClientRect();

    var cx1 = from.left + from.width / 2;
    var cy1 = from.top + from.height / 2;
    var cx2 = to.left + to.width / 2;
    var cy2 = to.top + to.height / 2;
    var dx = cx1 - cx2;
    var dy = cy1 - cy2;
    var scale = from.width / to.width;

    viewerImg.style.transition = 'transform .35s cubic-bezier(.4,0,.6,1), opacity .3s ease';
    viewerImg.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ')';
    viewerImg.style.opacity = '0.2';

    viewer.classList.remove('show');

    setTimeout(function(){
      viewerImg.src = '';
      viewerImg.style.transition = '';
      viewerImg.style.transform = '';
      viewerImg.style.opacity = '';
      _lastTriggerEl = null;
    }, 380);
  }

  $('viewer-close').onclick = closeViewer;
  viewer.onclick = function(e){ if (e.target === viewer) closeViewer(); };
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && viewer.classList.contains('show')) closeViewer();
  });

  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || t.tagName.toLowerCase() !== 'button') return;
    // 跳过下拉菜单按钮
    if (t.classList && t.classList.contains('dropdown-trigger')) return;
    var id = t.getAttribute('data-id');
    var act = t.getAttribute('data-act');
    if (id && act) doVote(id, act, t);
  }, false);

  $('btn-reg').onclick = submitRegister;

  // ============ 初始化 ============

  function init(){
    setInterval(updateCountdown, 1000);

    fetch(API + '/api/dishes')
      .then(function(r){ return r.json(); })
      .then(function(all){
        allDishesCache = all || [];

        var monthSet = {};
        allDishesCache.forEach(function(d){
          var m = (d.date || '').slice(0, 7);
          if (m) monthSet[m] = true;
        });
        var months = Object.keys(monthSet).sort();

        return fetch(API + '/api/vote_status')
          .then(function(r){ return r.json(); })
          .then(function(s){
            monthDeadlines = s.deadlines || {};
            renderMonthSelect(months);

            return fetch(API + '/api/current_month')
              .then(function(r){ return r.json(); })
              .then(function(m){
                var target = (m.month || '').trim();
                if (target && months.indexOf(target) !== -1) return target;
                var openMonths = months.filter(function(mm){
                  var info = monthDeadlines[mm];
                  return info && info.open !== false;
                });
                if (openMonths.length > 0) return openMonths[openMonths.length - 1];
                if (months.length > 0) return months[months.length - 1];
                return '';
              });
          });
      })
      .then(function(target){
        loadMonth(target);
      })
      .catch(function(){
        $('month-tip').textContent = '📅 加载失败，请刷新';
        updateCountdown();
      });
  }

  function loadVotes(){
    fetch(API + '/api/votes')
      .then(function(r){ return r.json(); })
      .then(function(v){
        votes = v || {};
        render();
        if (user) refreshUserVotes();
        else showModal();
      })
      .catch(function(){
        render();
        if (!user) showModal();
      });
  }

  function refreshUserVotes(){
    if (!user) return;
    fetch(API + '/api/user_votes?phone=' + encodeURIComponent(user.phone))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.success){
          user.votes = d.votedDishes || {};
          localStorage.setItem('chef_user', JSON.stringify(user));
          render();
        }
      })
      .catch(function(){});
  }

  setInterval(function(){
    if (document.hidden) return;
    fetch(API + '/api/votes')
      .then(function(r){ return r.json(); })
      .then(function(v){
        var changed = false;
        for (var k in v){
          if (v[k] !== votes[k]){ changed = true; break; }
        }
        if (changed){ votes = v; render(); }
      })
      .catch(function(){});

    fetch(API + '/api/vote_status')
      .then(function(r){ return r.json(); })
      .then(function(s){
        monthDeadlines = s.deadlines || {};
        rebuildPanel();
        updateMonthSelectUI();
      })
      .catch(function(){});
  }, 15000);

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
