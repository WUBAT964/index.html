<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月度好菜投票</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 14px; font-size: 16px; }
h1 { text-align: center; color: #333; font-size: 1.8em; margin: 12px 0; }
.month-tip { text-align: center; font-weight: bold; color: #fff; background: #ff9800; padding: 12px; border-radius: 8px; margin: 0 auto 18px; max-width: 480px; font-size: 1.05em; }
.user-info { text-align: center; color: #28a745; font-weight: bold; margin-bottom: 14px; font-size: 1em; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 1300px; margin: 0 auto; }
.card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: flex; flex-direction: column; }
.card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #eee; cursor: pointer; }
.no-img { width: 100%; height: 220px; background: #eee; display: flex; align-items: center; justify-content: center; color: #999; font-size: 1em; }

.info { padding: 12px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
.name { font-weight: bold; color: #333; font-size: 1.15em; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chef { color: #007bff; margin: 4px 0; font-size: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date { color: #888; font-size: .95em; }
.votes { color: #ff9800; font-weight: bold; font-size: 1.15em; margin: 6px 0; }
.btns { display: flex; gap: 6px; margin-top: 8px; }
button { flex: 1; padding: 11px 2px; border: none; border-radius: 6px; color: #fff; font-size: 1em; cursor: pointer; font-family: inherit; -webkit-appearance: none; }
.add { background: #007bff; }
.remove { background: #6c757d; }
button:disabled { background: #ccc; cursor: not-allowed; }

.podium { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.podium-title { text-align: center; color: #ff9800; font-weight: bold; margin-bottom: 14px; font-size: 1.3em; }
.podium-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.podium-card { border-radius: 10px; overflow: hidden; position: relative; border: 3px solid #eee; background: #fff; }
.podium-card.r1 { border-color: #FFD700; }
.podium-card.r2 { border-color: #C0C0C0; }
.podium-card.r3 { border-color: #CD7F32; }
.podium-badge { position: absolute; top: 8px; left: 8px; padding: 4px 10px; border-radius: 12px; font-size: .85em; font-weight: bold; background: #FFD700; color: #333; z-index: 2; }
.podium-card.r2 .podium-badge { background: #C0C0C0; }
.podium-card.r3 .podium-badge { background: #CD7F32; color: #fff; }

/* ⚠️ 领奖台图片和投票区一样大：220px */
.podium-card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #eee; }
.podium-card .no-img { width: 100%; height: 220px; }

.podium-info { padding: 12px; text-align: center; }
.podium-name { font-weight: bold; color: #333; font-size: 1.15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.podium-chef { color: #d9534f; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; font-size: 1em; }
.podium-date { color: #888; font-size: .95em; margin-top: 4px; }
.podium-votes { color: #ff9800; font-weight: bold; margin-top: 6px; font-size: 1.2em; }

.modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,.6); justify-content: center; align-items: center; }
.modal.show { display: flex; }
.modal-box { background: #fff; padding: 28px; border-radius: 12px; width: 88%; max-width: 400px; text-align: center; }
.modal-box h2 { margin: 0 0 12px; color: #333; font-size: 1.4em; }
.modal-box p { color: #666; font-size: 1em; margin: 0 0 14px; }
.modal-box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 1.05em; font-family: inherit; box-sizing: border-box; -webkit-appearance: none; }
.modal-box button { width: 100%; padding: 13px; background: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 1.1em; margin-top: 10px; }
.err { color: #d9534f; font-size: .95em; margin-bottom: 8px; display: none; }

.viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99999; justify-content: center; align-items: center; }
.viewer.show { display: flex; }
.viewer img { max-width: 95%; max-height: 90%; object-fit: contain; }
.viewer-close { position: absolute; top: 10px; right: 15px; color: #fff; font-size: 36px; font-weight: bold; cursor: pointer; padding: 5px 14px; line-height: 1; background: rgba(255,255,255,.1); border-radius: 50%; }

/* 手机端：投票区 110px，领奖台也是 110px */
@media (max-width: 768px) {
  body { padding: 8px; font-size: 15px; }
  h1 { font-size: 1.5em; }
  .month-tip { font-size: .95em; padding: 10px; margin-bottom: 12px; }
  .user-info { font-size: .95em; }
  .grid { gap: 6px; }
  .card img, .no-img { height: 110px; }
  .info { padding: 7px; }
  .name { font-size: 1em; margin-bottom: 3px; }
  .chef { font-size: .85em; margin: 3px 0; }
  .date { font-size: .8em; }
  .votes { font-size: 1em; margin: 4px 0; }
  button { padding: 8px 2px; font-size: .85em; }
  .btns { gap: 4px; margin-top: 5px; }

  .podium { padding: 10px; margin-bottom: 12px; }
  .podium-title { font-size: 1.1em; margin-bottom: 10px; }
  .podium-grid { gap: 6px; }
  .podium-card img, .podium-card .no-img { height: 110px; }
  .podium-info { padding: 6px; }
  .podium-name { font-size: 1em; }
  .podium-chef { font-size: .85em; margin-top: 3px; }
  .podium-date { font-size: .8em; margin-top: 3px; }
  .podium-votes { font-size: 1em; margin-top: 4px; }
}
</style>
</head>
<body>
<h1>🍽️ 月度好菜投票</h1>
<div class="month-tip" id="month-tip">📅 加载中...</div>
<div class="user-info" id="user-info"></div>

<div class="podium" id="podium" style="display:none">
  <div class="podium-title">🏆 票数最高的前三名 🏆</div>
  <div class="podium-grid" id="podium-grid"></div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>身份验证</h2>
    <p>请输入手机号和姓名</p>
    <input type="tel" id="in-phone" placeholder="手机号">
    <input type="text" id="in-name" placeholder="姓名（首次注册需填写）">
    <div class="err" id="err"></div>
    <button id="btn-reg" type="button">登录 / 注册</button>
  </div>
</div>

<div class="viewer" id="viewer">
  <span class="viewer-close" id="viewer-close">✕</span>
  <img id="viewer-img" src="" alt="">
</div>

<script>
(function(){
  "use strict";

  // ⚠️ 隧道地址变了就改这一行
  var API = 'https://exemption-eliminate-watts-merchant.trycloudflare.com';

  var votes = {};
  var dishes = [];
  var user = null;
  try { user = JSON.parse(localStorage.getItem('chef_user') || 'null'); } catch(e) { user = null; }

  function $(id){ return document.getElementById(id); }
  function getVote(dishId){ return (user && user.votes && user.votes[dishId]) ? user.votes[dishId] : 0; }
  function getTotalVoted(){
    if (!user || !user.votes) return 0;
    var t = 0;
    for (var k in user.votes) { if (user.votes.hasOwnProperty(k)) t += user.votes[k]; }
    return t;
  }
  function chefName(d){
    var a = d.chef1 || '', b = d.chef2 || '';
    if (a && b) return a + ' & ' + b;
    return a || b || '未知厨师';
  }
  function fmtDate(s){
    if (!s) return '未知';
    var p = String(s).split('-');
    if (p.length >= 3) return p[1] + '月' + p[2] + '日';
    return s;
  }
  function imgUrl(f){
    if (!f) return '';
    f = String(f).trim();
    if (!f) return '';
    if (f.indexOf('http') === 0) return f;
    return API + '/' + f;
  }

  function render(){
    var g = $('grid');
    g.innerHTML = '';
    var maxed = getTotalVoted() >= 3;

    for (var i = 0; i < dishes.length; i++){
      var d = dishes[i];
      var id = String(d.id);
      var url = imgUrl(d.img);
      var my = getVote(id);
      var total = votes[id] || 0;

      var card = document.createElement('div');
      card.className = 'card';

      var imgEl;
      if (url){
        imgEl = document.createElement('img');
        imgEl.src = url;
        imgEl.loading = 'lazy';
        (function(u){ imgEl.onclick = function(){ openViewer(u); }; })(url);
      } else {
        imgEl = document.createElement('div');
        imgEl.className = 'no-img';
        imgEl.textContent = '暂无图片';
      }
      card.appendChild(imgEl);

      var info = document.createElement('div');
      info.className = 'info';

      var nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = d.name || '';
      info.appendChild(nameEl);

      var chefEl = document.createElement('div');
      chefEl.className = 'chef';
      chefEl.textContent = '👨‍🍳 ' + chefName(d);
      info.appendChild(chefEl);

      var dateEl = document.createElement('div');
      dateEl.className = 'date';
      dateEl.textContent = '📅 ' + fmtDate(d.date);
      info.appendChild(dateEl);

      var votesEl = document.createElement('div');
      votesEl.className = 'votes';
      votesEl.id = 'v-' + id;
      votesEl.textContent = total + ' 票';
      info.appendChild(votesEl);

      var btns = document.createElement('div');
      btns.className = 'btns';

      var addBtn = document.createElement('button');
      addBtn.className = 'add';
      addBtn.type = 'button';
      addBtn.textContent = '投一票';
      if (maxed) addBtn.disabled = true;
      addBtn.setAttribute('data-id', id);
      addBtn.setAttribute('data-act', 'add');
      btns.appendChild(addBtn);

      var rmBtn = document.createElement('button');
      rmBtn.className = 'remove';
      rmBtn.type = 'button';
      rmBtn.textContent = '取消';
      if (my <= 0) rmBtn.disabled = true;
      rmBtn.setAttribute('data-id', id);
      rmBtn.setAttribute('data-act', 'remove');
      btns.appendChild(rmBtn);

      info.appendChild(btns);
      card.appendChild(info);
      g.appendChild(card);
    }
    renderPodium();
    $('user-info').textContent = user ? '当前用户：' + user.name + '（已投 ' + getTotalVoted() + '/3 票）' : '';
  }

  function renderPodium(){
    var arr = [];
    for (var i = 0; i < dishes.length; i++){
      var d = dishes[i];
      var v = votes[String(d.id)] || 0;
      if (v > 0) arr.push({ dish: d, votes: v });
    }
    arr.sort(function(a, b){ return b.votes - a.votes; });
    var top = arr.slice(0, 3);
    var p = $('podium'), g = $('podium-grid');
    if (top.length === 0){ p.style.display = 'none'; return; }
    p.style.display = 'block';
    g.innerHTML = '';
    for (var i = 0; i < top.length; i++){
      var it = top[i], d = it.dish, url = imgUrl(d.img);
      var rank = i + 1;
      var badge = rank === 1 ? '🥇 第一' : rank === 2 ? '🥈 第二' : '🥉 第三';
      var card = document.createElement('div');
      card.className = 'podium-card r' + rank;

      var badgeEl = document.createElement('div');
      badgeEl.className = 'podium-badge';
      badgeEl.textContent = badge;
      card.appendChild(badgeEl);

      if (url){
        var img = document.createElement('img');
        img.src = url;
        card.appendChild(img);
      } else {
        var ph = document.createElement('div');
        ph.className = 'no-img';
        ph.textContent = '暂无图片';
        card.appendChild(ph);
      }

      var info = document.createElement('div');
      info.className = 'podium-info';
      info.innerHTML = '<div class="podium-name">🍽️ ' + (d.name || '') + '</div>' +
                       '<div class="podium-chef">👨‍🍳 ' + chefName(d) + '</div>' +
                       '<div class="podium-date">📅 ' + fmtDate(d.date) + '</div>' +
                       '<div class="podium-votes">' + it.votes + ' 票</div>';
      card.appendChild(info);
      g.appendChild(card);
    }
  }

  function showModal(){ $('modal').className = 'modal show'; }
  function hideModal(){ $('modal').className = 'modal'; }

  function submitRegister(){
    var phone = $('in-phone').value.trim();
    var name = $('in-name').value.trim();
    var err = $('err');
    err.style.display = 'none';
    if (!phone){ err.textContent = '手机号不能为空'; err.style.display = 'block'; return; }

    var btn = $('btn-reg');
    btn.disabled = true;
    btn.textContent = '处理中...';

    fetch(API + '/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, phone: phone })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      btn.disabled = false;
      btn.textContent = '登录 / 注册';
      if (data.success){
        user = { name: data.name, phone: phone, votes: data.votedDishes || {} };
        localStorage.setItem('chef_user', JSON.stringify(user));
        hideModal();
        render();
      } else {
        err.textContent = data.error || '失败';
        err.style.display = 'block';
      }
    })
    .catch(function(){
      btn.disabled = false;
      btn.textContent = '登录 / 注册';
      err.textContent = '网络错误，请重试';
      err.style.display = 'block';
    });
  }

  function doVote(id, act, btn){
    if (!user){ showModal(); return; }
    if (act === 'add' && getTotalVoted() >= 3){ alert('您最多只能投3票，请先取消其他菜的投票'); return; }

    btn.disabled = true;
    var oldText = btn.textContent;
    btn.textContent = '...';

    fetch(API + '/api/vote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dish_id: id, action: act, phone: user.phone })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      btn.disabled = false;
      btn.textContent = oldText;
      if (data.success){
        votes[id] = data.count;
        user.votes = data.myVotes || {};
        localStorage.setItem('chef_user', JSON.stringify(user));
        render();
      } else {
        alert(data.error || '失败');
      }
    })
    .catch(function(){
      btn.disabled = false;
      btn.textContent = oldText;
      alert('网络错误，请重试');
    });
  }

  var viewer = $('viewer');
  function openViewer(url){
    $('viewer-img').src = url;
    viewer.className = 'viewer show';
  }
  function closeViewer(){
    viewer.className = 'viewer';
    $('viewer-img').src = '';
  }
  $('viewer-close').onclick = closeViewer;
  viewer.onclick = function(e){ if (e.target === viewer) closeViewer(); };

  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || t.tagName.toLowerCase() !== 'button') return;
    var id = t.getAttribute('data-id');
    var act = t.getAttribute('data-act');
    if (id && act) doVote(id, act, t);
  }, false);

  $('btn-reg').onclick = submitRegister;

  function init(){
    fetch(API + '/api/current_month')
      .then(function(r){ return r.json(); })
      .then(function(m){ loadDishes(m.month || ''); })
      .catch(function(){ loadDishes(''); });
  }

  function loadDishes(targetMonth){
    fetch(API + '/api/dishes')
      .then(function(r){ return r.json(); })
      .then(function(all){
        var tip = $('month-tip');
        if (targetMonth){
          dishes = all.filter(function(d){ return (d.date || '').indexOf(targetMonth) === 0; });
          tip.textContent = '📅 当前月份：' + targetMonth + '（共 ' + dishes.length + ' 道菜）';
        } else {
          var months = {};
          all.forEach(function(d){
            var m = (d.date || '').slice(0, 7);
            if (m) months[m] = 1;
          });
          var arr = Object.keys(months).sort();
          var latest = arr[arr.length - 1] || '';
          if (latest){
            dishes = all.filter(function(d){ return (d.date || '').indexOf(latest) === 0; });
            tip.textContent = '📅 当前月份：' + latest + '（自动）';
          } else {
            dishes = all;
            tip.textContent = '📅 显示全部菜品';
          }
        }
        dishes.sort(function(a, b){ return (a.date || '').localeCompare(b.date || ''); });
        loadVotes();
      })
      .catch(function(){ $('month-tip').textContent = '📅 加载失败，请刷新'; });
  }

  function loadVotes(){
    fetch(API + '/api/votes')
      .then(function(r){ return r.json(); })
      .then(function(v){
        votes = v || {};
        render();
        if (user) refreshUserVotes();
        else showModal();
      })
      .catch(function(){
        render();
        if (!user) showModal();
      });
  }

  function refreshUserVotes(){
    if (!user) return;
    fetch(API + '/api/user_votes?phone=' + encodeURIComponent(user.phone))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.success){
          user.votes = d.votedDishes || {};
          localStorage.setItem('chef_user', JSON.stringify(user));
          render();
        }
      })
      .catch(function(){});
  }

  setInterval(function(){
    if (document.hidden) return;
    fetch(API + '/api/votes')
      .then(function(r){ return r.json(); })
      .then(function(v){
        var changed = false;
        for (var k in v){
          if (v[k] !== votes[k]){ changed = true; break; }
        }
        if (changed){ votes = v; render(); }
      })
      .catch(function(){});
  }, 15000);

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
